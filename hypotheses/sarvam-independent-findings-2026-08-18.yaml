  # ================================================================
  # FINDING F-ML-001 — tool schema vs. real API mismatch
  # ================================================================
  - id: F-ML-001
    title: "sarvam_tools_transliterate's declared sa-IN language code is rejected by the real API"
    statement: >
      The MCP tool's parameter schema for sarvam_tools_transliterate lists
      "sa-IN" as a valid source_language_code / target_language_code enum
      value. Calling it with source_language_code="sa-IN" fails at the
      HTTP layer with a validation error: the real Sarvam API only
      accepts 'auto', 'en-IN', 'hi-IN', 'bn-IN', 'gu-IN', 'kn-IN',
      'ml-IN', 'mr-IN', 'od-IN', 'pa-IN', 'ta-IN', 'te-IN' — sa-IN is not
      among them despite being declared in the tool's own schema.
    status: CONFIRMED (tool-behavior finding, not a linguistic claim)
    evidence:
      - method: >
          Called sarvam_tools_transliterate with source_language_code=
          "sa-IN", target_language_code="en-IN", input="भू गम् कृ ग्रह् ज्ञा".
      - result: >
          HTTP-layer error: "body.source_language_code : Input should be
          'auto', 'en-IN', 'hi-IN', 'bn-IN', 'gu-IN', 'kn-IN', 'ml-IN',
          'mr-IN', 'od-IN', 'pa-IN', 'ta-IN' or 'te-IN'" — sa-IN rejected.
    limitations:
      - >
          Only tested via the MCP tool wrapper, not the raw Sarvam HTTP
          API directly — the mismatch could be in the MCP server's own
          schema declaration rather than a recent API change upstream.
      - >
          Not retested against other Sarvam endpoints (translate,
          identify_language) for the same sa-IN gap; scope is limited to
          transliterate.
    relation_to_repository: >
      None to my-lisp directly. Relevant to any repo (shiva-sutras,
      my-lisp-panini) planning to lean on sarvam_tools_transliterate for
      Sanskrit-specific transliteration — the workaround used here
      (source_language_code="hi-IN" as a Devanagari-script proxy) changes
      the result (see F-ML-002), it is not a clean substitute.
    reconciliation_questions:
      - "Does the Sarvam MCP server need its declared schema corrected, or does the upstream API need sa-IN added?"
      - "Has anyone actually gotten sa-IN accepted by a different Sarvam endpoint or a newer API version?"

  # ================================================================
  # FINDING F-ML-002 — hi-IN transliteration proxy diverges from classical IAST
  # ================================================================
  - id: F-ML-002
    title: "hi-IN-routed transliteration of Sanskrit dhatu forms uses Hindi colloquial readings, not classical IAST"
    statement: >
      Transliterating five Devanagari dhātu forms (भू गम् कृ ग्रह् ज्ञा)
      through source_language_code="hi-IN" (the only available proxy for
      Devanagari input, per F-ML-001) produced "Bhu gaam kr grah gya" —
      diverging from classical IAST (bhū gam kṛ grah jñā) on at least two
      points: गम् rendered "gaam" (implying a long ā not present in the
      dhātu) and ज्ञा rendered "gya" (the modern Hindi colloquial reading
      of ज्ञ, not the classical Sanskrit jñā). This is consistent with
      the tool routing Devanagari input through Hindi orthographic/
      phonological conventions rather than a Sanskrit-aware model.
    status: HYPOTHESIS
    evidence:
      - method: >
          sarvam_tools_transliterate(input="भू गम् कृ ग्रह् ज्ञा",
          source_language_code="hi-IN", target_language_code="en-IN").
      - result: "\"Bhu gaam kr grah gya\""
      - comparison_baseline: >
          my-lisp's own SLP1<->IAST/Devanagari tables
          (crates/my-lisp/src/semantic/{transliteration,devanagari}.rs,
          cross-checked in atoms.rs's REGISTRY) give bhū/gam/kṛ/grah/jñā
          for these same five dhātu — not independently reverified against
          a primary Sanskrit source in this exchange, so this is a
          comparison between two unverified-against-primary-source claims,
          not a ground-truth check.
    limitations:
      - >
          Single input string, five forms, one call. Not a systematic
          survey of which Devanagari sequences produce Hindi-style vs.
          Sanskrit-style readings.
      - >
          "gya" for ज्ञ IS the standard modern Hindi reading (not a Sarvam
          bug in the Hindi-transliteration sense) — the actual gap is that
          there is no Sanskrit-specific mode to route to instead (see
          F-ML-001), not that hi-IN mode itself is behaving incorrectly
          for Hindi.
    relation_to_repository: >
      Relevant to my-lisp's own SANSKRIT-SLP1-ROUNDTRIP-VALIDATOR task and
      to shiva-sutras/my-lisp-panini's transliteration pipelines if either
      considers using Sarvam as a transliteration source — this finding
      says don't, at least not via hi-IN, without a human or a primary-
      source check in the loop.
    reconciliation_questions:
      - "Does shiva-sutras' or my-lisp-panini's own transliteration pipeline hit the same hi-IN-only constraint, or do they have a different Sarvam access path with real sa-IN support?"

  # ================================================================
  # FINDING F-ML-003 — independent citation divergence (kartā's defining sutra)
  # ================================================================
  - id: F-ML-003
    title: "Sarvam's cited Ashtadhyayi sutra for kartā's core definition does not match this repo's own prior (also unverified) citation"
    statement: >
      Asked cold (no hint of any prior answer, system-prompted as an
      "independent linguistic reviewer... no prior context about any
      project") for the traditional Paninian definition of kartā (कर्ता)
      as a kāraka and its distinction from a mere grammatical subject,
      Sarvam answered citing "Ashtadhyayi sutra 1.4.42" and glossed it as
      "the agent is that for whom the remainder of the action resides."
      This repo's own swarm task PHILOSOPHY-SVA-VS-PARA-KARTR (defined
      2026-08-18, same session, before this test) instead references
      "Panini 1.4.54-55" — the sutra conventionally cited for kartā
      (1.4.54, "svatantraḥ kartā" — "the independent one is the agent")
      in general secondary literature.
    status: RESOLVED 2026-08-18 (MYLISP-VERIFY-KARTR-SUTRA-CITATION) — Sarvam's citation was wrong, this repo's prior 1.4.54-55 was right
    evidence:
      - prompt: >
          system: "You are an independent linguistic reviewer of Sanskrit
          grammar. Answer briefly and directly, in English. No prior
          context about any project." user: "In Panini's grammar, what is
          the traditional definition of 'karta' (कर्ता) as a karaka
          (semantic role), and how does it differ from a mere grammatical
          subject? Answer in 3-4 sentences, citing the relevant
          Ashtadhyayi sutra number if you know it."
      - sarvam_response: >
          "In Panini's grammar, 'karta' (कर्ता) is traditionally defined
          as the semantic agent or independent initiator of an action.
          This functional definition is provided by the Ashtadhyayi sutra
          1.4.42, which states the agent is that for whom the remainder
          of the action resides. It differs from a mere grammatical
          subject, which is a syntactic category defined by its agreement
          with the verb, because 'karta' is a semantic role defined by
          its function. Consequently, the grammatical subject and the
          karta do not always coincide, as seen in passive sentences."
          (finish_reason: stop, completion_tokens: 1501 for this ~4-sentence
          answer — consistent with shiva-sutras' documented reasoning-model
          overhead in docs/how-to-work-with-sarvam.md)
      - this_repos_prior_unverified_citation: >
          PHILOSOPHY-SVA-VS-PARA-KARTR (swarm task, defined earlier the
          same session by my-lisp-1) cites "Panini 1.4.54-55" — itself
          recalled from general knowledge at task-definition time, not
          checked against a primary source either.
    limitations:
      - >
          Resolved against shiva-sutras' own gated GRETIL corpus
          (external_data/gretil_astadhyayi.json), not an independently
          acquired critical edition — inherits whatever provenance/
          accuracy guarantees that corpus itself has (see shiva-sutras'
          own SIVA-* provenance tasks for that corpus's sourcing).
    resolution:
      method: >
        Grepped external_data/gretil_astadhyayi.json (shiva-sutras repo)
        directly for both sutra numbers.
      found:
        "1.4.42": "sādhakatamam karaṇam — \"the most effective means is karaṇa [instrument]\" — this is karaṇa's defining sutra, NOT kartā's."
        "1.4.54": "svatantraḥ kartā — \"the independent one is the agent\" — this repo's original citation, confirmed correct."
        "1.4.55": "tat-prayojakaḥ hetuś ca — \"and the one who causes [the independent agent to act] is hetu\" — directly answers PHILOSOPHY-SVA-VS-PARA-KARTR's own open question about a causative/prayojaka role: hetu is 1.4.55's own term for it, already in the primary source."
      conclusion: >
        Sarvam's citation (1.4.42) was wrong — both the sutra number and
        the paraphrase it gave ("that for whom the remainder of the
        action resides") don't match 1.4.42's actual text either, so this
        wasn't a case of Sarvam correctly describing a different sutra
        under the wrong number — it was a genuine hallucination on both
        the number and the content. This repo's own prior citation
        (1.4.54-55, recalled from memory before this verification) was
        correct.
    relation_to_repository: >
      Resolves the open question in PHILOSOPHY-SVA-VS-PARA-KARTR directly:
      1.4.55's hetu is the primary-source term for the
      caution/prayojaka distinction that task asks about, not something
      needing invention.
    reconciliation_questions: []

  # ================================================================
  # FINDING F-ML-004 — follow-up on F-ML-001/F-ML-002: confirmed no
  # Sanskrit mode exists, AND Sarvam's own self-description is wrong
  # ================================================================
  - id: F-ML-004
    title: "Asked cold, Sarvam confirms no dedicated Sanskrit transliteration mode exists -- but its own suggested fix is itself rejected by its real API"
    statement: >
      Per MYLISP-SARVAM-RESOLVE-OPEN-FINDINGS (shiva-sutras-1's follow-up
      task), asked Sarvam directly (cold, independent-reviewer framing,
      no mention of F-ML-001/F-ML-002) whether sa-IN is supported and
      what the correct codes for classical Sanskrit transliteration are.
      It confirmed: "No, 'sa-IN' is not a supported language code... There
      is no dedicated Sanskrit mode," and recommended
      source_language_code="hi-IN", target_language_code="en-US" as the
      workaround. This escalates F-ML-001 from "MCP schema declares a
      code the API rejects" to CONFIRMED "no Sanskrit-aware transliteration
      mode exists at all, and the model itself knows this" -- not merely a
      schema-vs-API mismatch that might be an MCP wrapper bug.
      However, the suggested target_language_code="en-US" is ALSO not in
      the real API's accepted enum (confirmed earlier this session:
      only 'auto','en-IN','hi-IN','bn-IN','gu-IN','kn-IN','ml-IN','mr-IN',
      'od-IN','pa-IN','ta-IN','te-IN' are accepted -- no en-US). Sarvam's
      own description of its own API is itself inaccurate on a checkable
      detail, in the same answer that correctly identified the sa-IN gap.
    status: CONFIRMED (F-ML-001/F-ML-002 escalated, and en-US rejection now directly retested)
    evidence:
      - prompt: >
          system: "You are an independent technical reviewer of the Sarvam
          API's language/transliteration capabilities. Answer briefly and
          directly. No prior context about any project." user: "For the
          Sarvam AI transliteration API (sarvam_tools_transliterate
          /transliterate endpoint), which source_language_code and
          target_language_code values, if any, are correct for classical
          Sanskrit (not Hindi) text transliteration between Devanagari and
          IAST/Latin script? Is 'sa-IN' supported by the actual API, or is
          there no dedicated Sanskrit mode?"
      - sarvam_response: >
          "No, 'sa-IN' is not a supported language code for the Sarvam
          transliteration API. There is no dedicated Sanskrit mode. To
          transliterate Devanagari Sanskrit text to Latin script
          (IAST/roman), you should use: source_language_code: hi-IN;
          target_language_code: en-US. The API will process the Devanagari
          text correctly, as it is the same script used for Hindi."
          (finish_reason: stop, no max_tokens set)
      - direct_retest: >
          Called sarvam_tools_transliterate(input="भू",
          source_language_code="hi-IN", target_language_code="en-US")
          directly. Rejected at the MCP tool's own schema-validation layer
          (before even reaching Sarvam's HTTP API): "Invalid option:
          expected one of en-IN|hi-IN|bn-IN|ta-IN|te-IN|gu-IN|kn-IN|
          ml-IN|mr-IN|pa-IN|od-IN|as-IN|ur-IN|ne-IN|kok-IN|ks-IN|sd-IN|
          sa-IN|sat-IN|mni-IN|brx-IN|mai-IN|doi-IN|auto|unknown" --
          en-US is not among them; en-IN is the only English target.
          Confirms Sarvam's own suggested fix was wrong on a directly
          checkable detail.
    limitations:
      - >
          Still does not establish whether classical-Sanskrit-vs-Hindi
          transliteration divergence (F-ML-002, jna -> "gya") is
          acceptable/expected behavior for hi-IN mode or a genuine product
          gap -- Sarvam's answer here treats hi-IN as a correct substitute
          ("will process the Devanagari text correctly"), which directly
          contradicts F-ML-002's finding that it does NOT produce classical
          IAST. This is Sarvam disagreeing with its own prior behavior,
          not this repo's interpretation.
    relation_to_repository: >
      Resolves MYLISP-SARVAM-RESOLVE-OPEN-FINDINGS: F-ML-001/F-ML-002 are
      confirmed real, structural tool limitations (no Sanskrit mode), not
      MCP-wrapper-only bugs. Any repo relying on Sarvam for Sanskrit
      transliteration should not expect a fix to arrive as a new language
      code -- the gap needs a workaround (post-processing hi-IN output
      through a classical-Sanskrit-aware correction step) or a different
      tool entirely, not a corrected API call.
    reconciliation_questions:
      - "Is there a non-transliterate Sarvam endpoint (e.g. the LLM chat completion itself, prompted for IAST output) that produces classical-IAST-correct results where the dedicated transliterate endpoint cannot?"

meta:
  guiding_principle: >
    Independent verification means asking the same primary question cold,
    not asking a tool to confirm a conclusion already reached. Both
    citations above are unverified; the value of this finding is
    surfacing the disagreement, not resolving it — resolution needs a
    primary source, not another LLM call. F-ML-004 is a second instance
    of the same discipline: even when a tool confirms a gap in itself
    cold, its own self-description can still be independently wrong on a
    checkable detail (en-US) in the very same answer — asking twice
    catches more than asking once.
