name: Verify 343 xtask evidence map exact head

on:
  pull_request:
    paths:
      - '.github/workflows/verify-343-xtask-a754.yml'

jobs:
  xtask-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify repository evidence graph
        run: cargo run -p xtask -- verify
