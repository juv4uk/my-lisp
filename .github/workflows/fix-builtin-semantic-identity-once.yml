name: Diagnose builtin semantic identity Clippy

on:
  push:
    branches:
      - fix/canon-builtin-semantic-identity

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/canon-builtin-semantic-identity
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply patch and capture Clippy diagnostic
        run: |
          python3 .github/scripts/fix-builtin-semantic-identity.py
          cargo fmt --all
          set +e
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee .github/scripts/clippy-last.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/scripts/clippy-last.log
            git commit -m "ci: capture builtin identity clippy diagnostic"
            git push origin HEAD:fix/canon-builtin-semantic-identity
          fi
          exit "$status"
