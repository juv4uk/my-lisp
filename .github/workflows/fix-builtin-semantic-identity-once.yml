name: Fix builtin semantic identity once

on:
  push:
    branches:
      - fix/canon-builtin-semantic-identity

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/canon-builtin-semantic-identity
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Make semantic ID the builtin identity key
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"expected patch anchor not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Builtin values carry semantic identity explicitly. The field is not
          # display spelling, and semantic construction validates against the
          # numeric registry so unknown IDs fail closed.
          replace_once(
              'crates/my-lisp/src/value.rs',
              '''pub struct Builtin {\n    pub name: &'static str,\n    #[allow(clippy::type_complexity)]\n    pub func: std::rc::Rc<\n        dyn Fn(&[Value], &crate::Environment, crate::Span) -> Result<Value, crate::LanguageError>,\n    >,\n}\n''',
              '''pub struct Builtin {\n    pub name: &'static str,\n    semantic_id: Option<&'static str>,\n    #[allow(clippy::type_complexity)]\n    pub func: std::rc::Rc<\n        dyn Fn(&[Value], &crate::Environment, crate::Span) -> Result<Value, crate::LanguageError>,\n    >,\n}\n\nimpl Builtin {\n    pub(crate) fn local(\n        name: &'static str,\n        func: std::rc::Rc<\n            dyn Fn(&[Value], &crate::Environment, crate::Span) -> Result<Value, crate::LanguageError>,\n        >,\n    ) -> Self {\n        Self {\n            name,\n            semantic_id: None,\n            func,\n        }\n    }\n\n    pub(crate) fn semantic(\n        name: &'static str,\n        semantic_id: &'static str,\n        func: std::rc::Rc<\n            dyn Fn(&[Value], &crate::Environment, crate::Span) -> Result<Value, crate::LanguageError>,\n        >,\n    ) -> Self {\n        assert_eq!(\n            crate::semantic_registry::semantic_id_for_surface(semantic_id),\n            Some(semantic_id),\n            "registered builtin semantic identity must exist in semantic-registry.wsm: {semantic_id}"\n        );\n        Self {\n            name,\n            semantic_id: Some(semantic_id),\n            func,\n        }\n    }\n\n    pub fn semantic_id(&self) -> Option<&'static str> {\n        self.semantic_id\n    }\n\n    fn same_semantic_identity(&self, other: &Self) -> bool {\n        matches!(\n            (self.semantic_id, other.semantic_id),\n            (Some(left), Some(right)) if left == right\n        )\n    }\n}\n''')

          replace_once(
              'crates/my-lisp/src/value.rs',
              '''            (Value::NumericBuffer(left), Value::NumericBuffer(right)) => left == right,\n            // Functions have identity: two separately created closures are not equal.\n''',
              '''            (Value::NumericBuffer(left), Value::NumericBuffer(right)) => left == right,\n            // Registered builtins are language operations, not allocation handles.\n            // Their semantic ID is the identity key; diagnostic/display spelling and\n            // `Rc` allocation are implementation details. Unregistered local builtins\n            // deliberately have no semantic identity and therefore do not compare equal.\n            (Value::Builtin(left), Value::Builtin(right)) => left.same_semantic_identity(right),\n            // Functions have identity: two separately created closures are not equal.\n''')

          replace_once(
              'crates/my-lisp/src/value.rs',
              '''impl Value {\n    pub fn vector(values: impl IntoIterator<Item = Value>) -> Self {\n''',
              '''impl Value {\n    /// Opaque numeric semantic identity for a registered builtin operation.\n    /// Human spelling and runtime allocation are intentionally not identity.\n    pub fn builtin_semantic_id(&self) -> Option<&'static str> {\n        match self {\n            Value::Builtin(builtin) => builtin.semantic_id(),\n            _ => None,\n        }\n    }\n\n    /// True only when both values are registered builtins carrying the same\n    /// numeric semantic ID. Missing IDs fail closed rather than falling back\n    /// to display spelling or pointer equality.\n    pub fn same_builtin_semantic_identity(&self, other: &Self) -> bool {\n        match (self, other) {\n            (Value::Builtin(left), Value::Builtin(right)) => left.same_semantic_identity(right),\n            _ => false,\n        }\n    }\n\n    pub fn vector(values: impl IntoIterator<Item = Value>) -> Self {\n''')

          # Add unit-level mutation witnesses: same ID across distinct allocations,
          # different IDs, missing IDs, and unknown-ID rejection.
          p = Path('crates/my-lisp/src/value.rs')
          text = p.read_text()
          marker = '\nimpl Drop for Value {'
          tests = r'''

#[cfg(test)]
mod builtin_semantic_identity_tests {
    use super::*;

    fn function() -> std::rc::Rc<
        dyn Fn(&[Value], &crate::Environment, crate::Span) -> Result<Value, crate::LanguageError>,
    > {
        std::rc::Rc::new(|_arguments, _environment, _span| Ok(Value::Nil))
    }

    #[test]
    fn semantic_identity_survives_distinct_allocations_and_diagnostic_names() {
        let left_builtin = std::rc::Rc::new(Builtin::semantic("left-display", "0104", function()));
        let right_builtin = std::rc::Rc::new(Builtin::semantic("right-display", "0104", function()));
        assert!(!std::rc::Rc::ptr_eq(&left_builtin, &right_builtin));

        let left = Value::Builtin(left_builtin);
        let right = Value::Builtin(right_builtin);
        assert_eq!(left.builtin_semantic_id(), Some("0104"));
        assert_eq!(right.builtin_semantic_id(), Some("0104"));
        assert!(left.same_builtin_semantic_identity(&right));
        assert_eq!(left, right);
    }

    #[test]
    fn distinct_semantic_ids_never_collapse() {
        let add = Value::Builtin(std::rc::Rc::new(Builtin::semantic("+", "0104", function())));
        let subtract =
            Value::Builtin(std::rc::Rc::new(Builtin::semantic("-", "1001", function())));
        assert!(!add.same_builtin_semantic_identity(&subtract));
        assert_ne!(add, subtract);
    }

    #[test]
    fn local_builtin_without_semantic_id_fails_closed_for_semantic_identity() {
        let shared = std::rc::Rc::new(Builtin::local("local-helper", function()));
        let left = Value::Builtin(shared.clone());
        let right = Value::Builtin(shared);
        assert_eq!(left.builtin_semantic_id(), None);
        assert!(!left.same_builtin_semantic_identity(&right));
        assert_ne!(left, right);
    }

    #[test]
    #[should_panic(expected = "registered builtin semantic identity must exist")]
    fn unknown_semantic_id_is_rejected_at_construction() {
        let _ = Builtin::semantic("ghost", "not-a-semantic-id", function());
    }
}
'''
          if 'mod builtin_semantic_identity_tests' not in text:
              if marker not in text:
                  raise SystemExit('Value Drop anchor missing')
              p.write_text(text.replace(marker, tests + marker, 1))

          # Root ordinary builtins remain local unless deliberately installed through
          # a semantic-ID peer binding. Peer slices attach their numeric identity.
          replace_once(
              'crates/my-lisp/src/eval/builtins.rs',
              '''fn builtin(name: &'static str, func: Native) -> Value {\n    Value::Builtin(std::rc::Rc::new(crate::value::Builtin { name, func }))\n}\n\nfn define_peer_builtin(\n    environment: &Environment,\n    diagnostic_name: &'static str,\n    semantic_id: &str,\n    func: Native,\n) {\n''',
              '''fn builtin(name: &'static str, func: Native) -> Value {\n    Value::Builtin(std::rc::Rc::new(crate::value::Builtin::local(name, func)))\n}\n\nfn semantic_builtin(\n    diagnostic_name: &'static str,\n    semantic_id: &'static str,\n    func: Native,\n) -> Value {\n    Value::Builtin(std::rc::Rc::new(crate::value::Builtin::semantic(\n        diagnostic_name,\n        semantic_id,\n        func,\n    )))\n}\n\nfn define_peer_builtin(\n    environment: &Environment,\n    diagnostic_name: &'static str,\n    semantic_id: &'static str,\n    func: Native,\n) {\n''')
          replace_once(
              'crates/my-lisp/src/eval/builtins.rs',
              '''    let value = builtin(diagnostic_name, func);\n    for name in names {\n''',
              '''    let value = semantic_builtin(diagnostic_name, semantic_id, func);\n    for name in names {\n''')

          # Canon callable values carry their Canon numeric IDs directly.
          replace_once(
              'crates/my-lisp/src/eval/canon.rs',
              '''fn builtin(\n    identity: &'static str,\n    func: impl Fn(&[Value], &Environment, Span) -> Result<Value, LanguageError> + 'static,\n) -> Value {\n    Value::Builtin(Rc::new(crate::value::Builtin {\n        name: identity,\n        func: Rc::new(func),\n    }))\n}\n''',
              '''fn builtin(\n    identity: &'static str,\n    semantic_id: &'static str,\n    func: impl Fn(&[Value], &Environment, Span) -> Result<Value, LanguageError> + 'static,\n) -> Value {\n    Value::Builtin(Rc::new(crate::value::Builtin::semantic(\n        identity,\n        semantic_id,\n        Rc::new(func),\n    )))\n}\n''')
          canon = Path('crates/my-lisp/src/eval/canon.rs')
          text = canon.read_text()
          for name, sid in [
              ('PRIM_ATOM', 'ATOM_SEMANTIC_ID'),
              ('PRIM_EQ', 'EQ_SEMANTIC_ID'),
              ('PRIM_CONS', 'CONS_SEMANTIC_ID'),
              ('PRIM_CAR', 'CAR_SEMANTIC_ID'),
              ('PRIM_CDR', 'CDR_SEMANTIC_ID'),
          ]:
              old = f'Some(builtin("{name}", |'
              new = f'Some(builtin("{name}", {sid}, |'
              if new not in text:
                  if old not in text:
                      raise SystemExit(f'Canon builtin anchor missing for {name}')
                  text = text.replace(old, new, 1)
          canon.write_text(text)

          # Keep the macro-construction mechanism explicitly local-only.
          replace_once(
              'crates/my-lisp/src/eval/macro_substrate.rs',
              '''        Value::Builtin(Rc::new(Builtin {\n            name: "make-macro",\n            func: Rc::new(make_macro_values),\n        })),\n''',
              '''        Value::Builtin(Rc::new(Builtin::local(\n            "make-macro",\n            Rc::new(make_macro_values),\n        ))),\n''')

          # Existing peer tests now prove semantic identity by numeric ID first;
          # pointer sharing is retained only as an implementation-allocation check.
          replace_once(
              'crates/my-lisp/tests/peer_surface_identity.rs',
              '''fn assert_same_builtin(left: &Value, right: &Value) {\n    match (left, right) {\n        (Value::Builtin(left), Value::Builtin(right)) => assert!(Rc::ptr_eq(left, right)),\n        other => panic!("expected two builtin values, got {other:?}"),\n    }\n}\n''',
              '''fn assert_same_builtin(semantic_id: &str, left: &Value, right: &Value) {\n    assert_eq!(left.builtin_semantic_id(), Some(semantic_id));\n    assert_eq!(right.builtin_semantic_id(), Some(semantic_id));\n    assert!(left.same_builtin_semantic_identity(right));\n    match (left, right) {\n        // Allocation sharing is a useful implementation invariant, but not the\n        // language-level identity proof; the numeric ID above is authoritative.\n        (Value::Builtin(left), Value::Builtin(right)) => assert!(Rc::ptr_eq(left, right)),\n        other => panic!("expected two builtin values, got {other:?}"),\n    }\n}\n''')
          p = Path('crates/my-lisp/tests/peer_surface_identity.rs')
          text = p.read_text()
          text = text.replace('assert_same_builtin(&uk, &sym);', 'assert_same_builtin("0104", &uk, &sym);')
          text = text.replace('assert_same_builtin(&sym, &sa);', 'assert_same_builtin("0104", &sym, &sa);')
          p.write_text(text)

          replace_once(
              'crates/my-lisp/tests/runtime_peer_operators.rs',
              '''fn assert_same_builtin(left: &Value, right: &Value) {\n    match (left, right) {\n        (Value::Builtin(left), Value::Builtin(right)) => assert!(\n            Rc::ptr_eq(left, right),\n            "peer spellings must point to one builtin allocation"\n        ),\n        other => panic!("expected builtin peer values, got {other:?}"),\n    }\n}\n''',
              '''fn assert_same_builtin(semantic_id: &str, left: &Value, right: &Value) {\n    assert_eq!(left.builtin_semantic_id(), Some(semantic_id));\n    assert_eq!(right.builtin_semantic_id(), Some(semantic_id));\n    assert!(left.same_builtin_semantic_identity(right));\n    match (left, right) {\n        (Value::Builtin(left), Value::Builtin(right)) => assert!(\n            Rc::ptr_eq(left, right),\n            "peer spellings should still share one implementation allocation"\n        ),\n        other => panic!("expected builtin peer values, got {other:?}"),\n    }\n}\n''')
          p = Path('crates/my-lisp/tests/runtime_peer_operators.rs')
          text = p.read_text()
          text = text.replace('assert_same_builtin(&uk, &sa);', 'assert_same_builtin(case.identity, &uk, &sa);')
          text = text.replace('assert_same_builtin(&sa, &sym);', 'assert_same_builtin(case.identity, &sa, &sym);')
          p.write_text(text)

          # Canon tests assert the numeric identity independently from pointer sharing.
          p = Path('crates/my-lisp/src/eval/canon.rs')
          text = p.read_text()
          old = '''        let numeric = value_for_surface(CAR_SEMANTIC_ID).expect("numeric Canon identity");\n        let human = value_for_surface("car").expect("historical Canon surface");\n        let (Value::Builtin(numeric), Value::Builtin(human)) = (&numeric, &human) else {\n'''
          new = '''        let numeric = value_for_surface(CAR_SEMANTIC_ID).expect("numeric Canon identity");\n        let human = value_for_surface("car").expect("historical Canon surface");\n        assert_eq!(numeric.builtin_semantic_id(), Some(CAR_SEMANTIC_ID));\n        assert_eq!(human.builtin_semantic_id(), Some(CAR_SEMANTIC_ID));\n        assert!(numeric.same_builtin_semantic_identity(&human));\n        let (Value::Builtin(numeric), Value::Builtin(human)) = (&numeric, &human) else {\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('Canon numeric identity test anchor missing')
              text = text.replace(old, new, 1)
          old = '''        let sanskrit = value_for_surface("ādi").expect("Sanskrit Canon value");\n        let (Value::Builtin(historical), Value::Builtin(ukrainian), Value::Builtin(sanskrit)) =\n'''
          new = '''        let sanskrit = value_for_surface("ādi").expect("Sanskrit Canon value");\n        for value in [&historical, &ukrainian, &sanskrit] {\n            assert_eq!(value.builtin_semantic_id(), Some(CAR_SEMANTIC_ID));\n            assert!(historical.same_builtin_semantic_identity(value));\n        }\n        let (Value::Builtin(historical), Value::Builtin(ukrainian), Value::Builtin(sanskrit)) =\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('Canon peer identity test anchor missing')
              text = text.replace(old, new, 1)
          p.write_text(text)

          # Broad legacy surface coverage may keep its pointer-sharing assertion,
          # but explicitly stops calling that semantic identity.
          replace_once(
              'crates/my-lisp/tests/uk_surface_equivalence.rs',
              '''        // A builtin is an operation handle. Canon EN/UK/SA spellings and\n        // ordinary aliases must retain one allocation, not merely similar code.\n        (Value::Builtin(left), Value::Builtin(right)) => Rc::ptr_eq(left, right),\n''',
              '''        // This broad legacy-coverage check keeps allocation sharing as an\n        // implementation invariant. Numeric semantic identity is proved separately\n        // by the focused Canon/peer-ID tests and must not be inferred from `Rc`.\n        (Value::Builtin(left), Value::Builtin(right)) => Rc::ptr_eq(left, right),\n''')

          # Executable public regression: eq observes semantic ID, not surface spelling.
          test = Path('crates/my-lisp/tests/builtin_semantic_identity.rs')
          expected = r'''use my_lisp::{eval_program, Session, Value};

fn value(session: &mut Session, source: &str) -> Value {
    eval_program(source, session)
        .unwrap_or_else(|error| panic!("{source}: {error:?}"))
        .value
}

fn assert_identity(session: &mut Session, semantic_id: &str, names: &[&str]) {
    let values = names
        .iter()
        .map(|name| value(session, name))
        .collect::<Vec<_>>();
    for item in &values {
        assert_eq!(item.builtin_semantic_id(), Some(semantic_id), "{names:?}");
        assert!(values[0].same_builtin_semantic_identity(item), "{names:?}");
    }
}

#[test]
fn canon_peer_spellings_are_one_numeric_builtin_identity() {
    let mut session = Session::default();
    assert_identity(&mut session, "0005", &["car", "перше", "ādi", ":п"]);
}

#[test]
fn ordinary_peer_spellings_are_one_numeric_builtin_identity() {
    let mut session = Session::default();
    assert_identity(&mut session, "0104", &["+", "додати", "yoga"]);
}

#[test]
fn eq_observes_registered_builtin_semantic_identity_not_spelling() {
    let mut session = Session::default();
    for source in ["(eq car перше)", "(eq перше ādi)", "(eq додати +)", "(eq + yoga)"] {
        assert_eq!(value(&mut session, source).to_string(), "t", "{source}");
    }
    assert_eq!(value(&mut session, "(eq + -)").to_string(), "()");
}
'''
          if test.exists():
              if test.read_text() != expected:
                  raise SystemExit('builtin_semantic_identity.rs exists with unexpected content')
          else:
              test.write_text(expected)

          # Documentation stops treating Rc allocation as the semantic proof.
          replace_once(
              'docs/PLAN-FULL-LANGUAGE-PARITY.md',
              '''4. **Одна тотожність — одна реалізація значення.** Для ordinary builtin це\n   означає один `Value::Builtin`; для Lisp-defined public value — один\n   створений closure/value, до якого прямо прив'язуються всі surface names.\n''',
              '''4. **Одна тотожність — один numeric semantic ID.** Для ordinary builtin\n   усі peer spellings несуть той самий ID. Спільний `Value::Builtin`/`Rc` може\n   лишатися корисним implementation invariant, але адреса алокації не є\n   мовною тотожністю. Для Lisp-defined public value діє той самий принцип:\n   surface names не створюють нової semantic identity.\n''')
          replace_once(
              'docs/PLAN-FULL-LANGUAGE-PARITY.md',
              '''**Gate B:** `Rc::ptr_eq` або еквівалентний identity proof для всіх builtin peer\nspellings.\n''',
              '''**Gate B:** усі builtin peer spellings мають той самий numeric semantic ID;\nрізні ID ніколи не зливаються; відсутній/невідомий ID fail-closed. `Rc::ptr_eq`\nдозволений лише як додатковий implementation-sharing check, не як semantic proof.\n''')
          PY
          cargo fmt --all
      - name: Focused builtin semantic identity tests
        run: |
          cargo test -p my-lisp builtin_semantic_identity -- --nocapture
          cargo test -p my-lisp --test builtin_semantic_identity -- --nocapture
          cargo test -p my-lisp --test peer_surface_identity -- --nocapture
          cargo test -p my-lisp --test runtime_peer_operators -- --nocapture
      - name: Full workspace regression
        run: cargo test --workspace
      - name: Zero-warning clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Commit verified semantic identity fix
        run: |
          if git diff --quiet; then
            echo "Semantic identity fix already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/my-lisp/src/value.rs crates/my-lisp/src/eval/builtins.rs crates/my-lisp/src/eval/canon.rs crates/my-lisp/src/eval/macro_substrate.rs crates/my-lisp/tests/builtin_semantic_identity.rs crates/my-lisp/tests/peer_surface_identity.rs crates/my-lisp/tests/runtime_peer_operators.rs crates/my-lisp/tests/uk_surface_equivalence.rs docs/PLAN-FULL-LANGUAGE-PARITY.md
          git commit -m "fix(canon): make semantic ID builtin identity"
          git push origin HEAD:fix/canon-builtin-semantic-identity
