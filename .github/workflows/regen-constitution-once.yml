name: Regenerate constitution projection once

on:
  push:
    branches:
      - prep/ukrainian-full-source

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prep/ukrainian-full-source
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate canonical constitution projection
        run: cargo run -p my-lisp-cli -- scripts/build-constitution.my > my-lisp-constitution.my
      - name: Commit generated projection
        run: |
          git diff -- my-lisp-constitution.my
          if git diff --quiet -- my-lisp-constitution.my; then
            echo "Projection already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my-lisp-constitution.my
          git commit -m "test: regenerate constitution projection"
          git push origin HEAD:prep/ukrainian-full-source
