name: Ukrainian semantic naming refinement v2

on:
  push:
    branches: [agent/uk-semantic-name-audit]
    paths:
      - '.github/workflows/uk-semantic-name-refinement-v2.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/uk-semantic-name-audit
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Apply token-aware second-pass audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          TARGET_REFINEMENTS = [
              ("nth", "елемент-списку-за-номером", "елемент-списку-за-індексом"),
              ("vec-nth", "елемент-вектора-за-номером", "елемент-вектора-за-індексом"),
          ]

          EXTRA = [
              ("member?", "містить?", "значення-у-списку?", "У виклику прямо видно відношення: значення належить списку."),
              ("string-prefix?", "текст-починається?", "префікс-тексту?", "Аргументи мають порядок префікс, текст; назва читається як питання про це відношення."),
              ("string-contains?", "містить-текст?", "фрагмент-у-тексті?", "Аргументи мають порядок фрагмент, текст; назва більше не приховує суб'єкт відношення."),
              ("codepoint->string", "код-у-текст", "кодова-точка-у-текст", "«Кодова точка» точно називає Unicode code point, а не довільний код або кодування."),
              ("string->codepoint", "текст-у-код", "текст-у-кодову-точку", "Результат точно названо Unicode кодовою точкою."),
              ("write-to-string", "у-текст", "значення-у-текст", "Функція серіалізує довільне Lisp-значення; назва більше не виглядає як безконтекстна конверсія."),
              ("unix-time-now", "юнікс-час-зараз", "поточний-юнікс-час", "Природний український порядок слів."),
              ("deadline-after-ns", "дедлайн-після-нс", "дедлайн-через-нс", "«Через N наносекунд» природно описує дельту від поточного монотонного часу."),
              ("map-contains?", "карта-містить?", "ключ-у-карті?", "У виклику прямо видно відношення ключа до карти й порядок аргументів."),
              ("contains-atom?", "містить-атом?", "атом-у-списку?", "Helper перевіряє заданий атом у списку; назва читається природно в порядку аргументів."),
          ]

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          # Lisp-ідентифікатор не повинен бути частиною іншого ідентифікатора.
          # Python \w Unicode-aware; додаємо punctuation, яку my-lisp допускає в іменах.
          ident = r"\w?!*+/<>=.\-"

          def replace_token(text, old, new):
              pattern = re.compile(rf"(?<![{ident}]){re.escape(old)}(?![{ident}])")
              return pattern.sub(new, text)

          def replace_tokens_simultaneously(text, replacements):
              ordered = sorted(replacements, key=lambda pair: len(pair[0]), reverse=True)
              marks = []
              for index, (old, new) in enumerate(ordered):
                  mark = f"__UK_TOKEN_RENAME_{index}__"
                  assert mark not in text
                  pattern = re.compile(rf"(?<![{ident}]){re.escape(old)}(?![{ident}])")
                  text, count = pattern.subn(mark, text)
                  marks.append((mark, new, count))
              for mark, new, _count in marks:
                  text = text.replace(mark, new)
              return text

          # 1. Реальна surface: змінюємо лише exact bindings.
          path = "lib/surface/uk.my"
          surface = read(path)
          for en, old, new in TARGET_REFINEMENTS:
              needle = f"(define {old} {en})"
              assert surface.count(needle) == 1, (needle, surface.count(needle))
              surface = surface.replace(needle, f"(define {new} {en})", 1)

          for en, old, new, _reason in EXTRA:
              needle = f"(define {old} {en})"
              assert surface.count(needle) == 1, (needle, surface.count(needle))
              surface = surface.replace(needle, f"(define {new} {en})", 1)

          # Legacy aliases нових 10 випадків додаємо до наявної секції сумісності.
          anchor = ";; Batch 2 — SA missing fill"
          assert anchor in surface
          aliases = "\n".join(f"(define {old} {en})" for en, old, _new, _reason in EXTRA) + "\n\n"
          pos = surface.index(anchor)
          # Вставляємо перед декоративною лінією, що безпосередньо передує Batch 2 — SA missing fill.
          sep = surface.rfind(";; ═══════════════════════════════════════════════════════════════", 0, pos)
          assert sep != -1
          surface = surface[:sep] + aliases + surface[sep:]
          write(path, surface)

          # 2. Coverage — exact EN+UK slots, без глобальних підрядкових замін.
          path = "lib/surface/uk-sa-coverage.wsm"
          coverage = read(path)
          for en, old, new in TARGET_REFINEMENTS:
              needle = f" {en} {old} "
              assert coverage.count(needle) == 1, (needle, coverage.count(needle))
              coverage = coverage.replace(needle, f" {en} {new} ", 1)
          for en, old, new, _reason in EXTRA:
              needle = f" {en} {old} "
              assert coverage.count(needle) == 1, (needle, coverage.count(needle))
              coverage = coverage.replace(needle, f" {en} {new} ", 1)
          write(path, coverage)

          # 3. Документація й runtime witnesses: тільки цілі identifiers.
          replacements = [(old, new) for _en, old, new in TARGET_REFINEMENTS]
          replacements += [(old, new) for _en, old, new, _reason in EXTRA]
          for path in [
              "lib/surface/uk-docs.wsm",
              "docs/ukrainian-api.md",
              "docs/ukrainian-surface-inventory.md",
              "crates/my-lisp/tests/ukrainian_api_docs.rs",
              "crates/my-lisp/tests/uk_sa_batch2.rs",
          ]:
              write(path, replace_tokens_simultaneously(read(path), replacements))

          # 4. Машинний аудит: 42/98; два проміжні target уточнюємо, 10 нових додаємо.
          path = "lib/surface/uk-name-audit.wsm"
          audit = read(path)
          assert "(renamed 32)" in audit and "(retained 108)" in audit
          audit = audit.replace("(renamed 32)", "(renamed 42)", 1)
          audit = audit.replace("(retained 108)", "(retained 98)", 1)
          audit = audit.replace(
              "(rename nth за-номером елемент-списку-за-номером ",
              "(rename nth за-номером елемент-списку-за-індексом ",
              1,
          )
          audit = audit.replace(
              "(rename vec-nth вектор-за-номером елемент-вектора-за-номером ",
              "(rename vec-nth вектор-за-номером елемент-вектора-за-індексом ",
              1,
          )
          close = "  ))\n"
          assert audit.endswith(close)
          rows = "".join(
              f'    (rename {en} {old} {new} "{reason}")\n'
              for en, old, new, reason in EXTRA
          )
          audit = audit[:-len(close)] + rows + close
          write(path, audit)

          # 5. Людський звіт: counts + exact target labels + 10 рядків.
          path = "docs/ukrainian-name-audit.md"
          human = read(path)
          human = human.replace(
              "**32** preferred-назви уточнено, **108** залишено без зміни",
              "**42** preferred-назви уточнено, **98** залишено без зміни",
              1,
          )
          human = human.replace("старі 32 назви", "старі 42 назви")
          human = human.replace("**`елемент-списку-за-номером`**", "**`елемент-списку-за-індексом`**", 1)
          human = human.replace("**`елемент-вектора-за-номером`**", "**`елемент-вектора-за-індексом`**", 1)
          anchor = "\n## Що перевірено й свідомо залишено\n"
          assert anchor in human
          rows = "".join(
              f"| `{en}` | `{old}` | **`{new}`** | {reason} |\n"
              for en, old, new, reason in EXTRA
          )
          human = human.replace(anchor, rows + anchor, 1)
          write(path, human)

          # 6. Footer/API counts та тестові counts.
          path = "docs/ukrainian-api.md"
          api = read(path).replace("32 preferred-назви уточнено", "42 preferred-назви уточнено")
          write(path, api)

          path = "crates/my-lisp/tests/ukrainian_api_docs.rs"
          tests = read(path)
          tests = tests.replace('(renamed 32)', '(renamed 42)')
          tests = tests.replace('(retained 108)', '(retained 98)')
          tests = tests.replace('assert_eq!(rename_rows, 32,', 'assert_eq!(rename_rows, 42,')
          write(path, tests)

          # 7. Fail-closed invariants перед Rust tests.
          surface = read("lib/surface/uk.my")
          coverage = read("lib/surface/uk-sa-coverage.wsm")
          audit = read("lib/surface/uk-name-audit.wsm")
          assert surface.count("(define середовище env)") == 1
          assert "(renamed 42)" in audit and "(retained 98)" in audit
          assert sum(1 for line in audit.splitlines() if line.strip().startswith("(rename ")) == 42

          # Підрядки на кшталт символ-у-текст НЕ мають бути пошкоджені short-name rename-ом.
          assert "символ-значення-у-текст" not in coverage
          assert "число-значення-у-текст" not in coverage
          assert "символ-у-текст" in coverage
          assert "число-у-текст" in coverage

          for en, old, new, _reason in EXTRA:
              assert f"(define {new} {en})" in surface
              assert f"(define {old} {en})" in surface
              assert f" {en} {new} " in coverage
              assert f" {en} {old} " not in coverage
          for en, _old, new in TARGET_REFINEMENTS:
              assert f"(define {new} {en})" in surface
              assert f" {en} {new} " in coverage

          print("token-aware second pass: 140 reviewed, 42 renamed, 98 retained")
          PY

      - name: Verify surface and documentation contracts
        run: |
          cargo test -p my-lisp --test uk_surface_equivalence
          cargo test -p my-lisp --test ukrainian_api_docs
          cargo test -p my-lisp --test uk_sa_batch2
          cargo test -p my-lisp --test documentation_contract
          cargo test -p my-lisp --test guard

      - name: Verify consumers
        run: |
          cargo test -p my-lisp-cli
          cargo test -p my-lisp-wasm

      - name: Zero-warning gate
        run: cargo clippy -p my-lisp -p my-lisp-cli -p my-lisp-wasm --all-targets -- -D warnings

      - name: Commit tested refinement
        run: |
          rm .github/workflows/uk-semantic-name-refinement.yml
          rm .github/workflows/uk-semantic-name-refinement-v2.yml
          git add -A
          git config user.name 'juv4uk'
          git config user.email '85576956+juv4uk@users.noreply.github.com'
          git commit -m 'refactor(surface): make Ukrainian calls self-explanatory'
          git push origin HEAD:agent/uk-semantic-name-audit
