name: Surface Drift Check

on:
  push:
    paths:
      - 'lib/core.my'
      - 'lib/surface/**'
      - 'crates/my-lisp/src/eval/builtins.rs'
      - 'crates/my-lisp/src/language_items.rs'
      - 'crates/my-lisp-cli/src/repl.rs'
      - 'crates/my-lisp-cli/src/repl/surface_catalog.rs'
      - 'scripts/check_surface_coverage.py'
      - 'scripts/check_trilingual_surface.py'
      - 'scripts/check_semantic_registry.py'
      - 'docs/adr/ADR-005-TRILINGUAL-SURFACE-PARITY.md'
      - 'docs/adr/ADR-007-MEANING-FIRST-SURFACES.md'
  pull_request:
    paths:
      - 'lib/core.my'
      - 'lib/surface/**'
      - 'crates/my-lisp/src/eval/builtins.rs'
      - 'crates/my-lisp/src/language_items.rs'
      - 'crates/my-lisp-cli/src/repl.rs'
      - 'crates/my-lisp-cli/src/repl/surface_catalog.rs'
      - 'scripts/check_surface_coverage.py'
      - 'scripts/check_trilingual_surface.py'
      - 'scripts/check_semantic_registry.py'
      - 'docs/adr/ADR-005-TRILINGUAL-SURFACE-PARITY.md'
      - 'docs/adr/ADR-007-MEANING-FIRST-SURFACES.md'

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check public-name inventory drift
        run: python3 scripts/check_surface_coverage.py

      - name: Check EN / UK / SA structural parity
        run: python3 scripts/check_trilingual_surface.py

      - name: Check meaning-first registry shape
        run: python3 scripts/check_semantic_registry.py

      - name: Report
        if: always()
        run: |
          echo "Surface drift check complete."
          echo "Meaning comes first; human-language surfaces are peers."
          echo "The neutral registry may grow with new languages without changing its shape."
          echo "The legacy trilingual gate remains authoritative until migration is complete."
