name: REPL surface implementation

on:
  push:
    paths:
      - .github/workflows/repl-surface-implementation.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply layered REPL surfaces
        run: python3 .github/scripts/repl_surface_impl.py

      - name: Format
        run: cargo fmt

      - name: Targeted tests
        run: |
          cargo test -p my-lisp environment::tests::reparent
          cargo test -p my-lisp-cli
          cargo test -p my-lisp-wasm

      - name: Zero-warning gate
        run: cargo clippy -p my-lisp -p my-lisp-cli -p my-lisp-wasm --all-targets -- -D warnings

      - name: Commit only if main has not moved
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main moved while REPL surface gate was running; refusing to overwrite parallel work"
            exit 1
          fi
          rm .github/workflows/repl-surface-implementation.yml
          rm .github/scripts/repl_surface_impl.py
          git config user.name "juv4uk"
          git config user.email "85576956+juv4uk@users.noreply.github.com"
          git add crates/my-lisp/src/environment.rs crates/my-lisp-cli/src/main.rs crates/my-lisp-cli/src/repl.rs crates/my-lisp-wasm/src/lib.rs public/my-lisp-cli-web.html .github/workflows/repl-surface-implementation.yml .github/scripts/repl_surface_impl.py
          git commit -m "feat(repl): switch programming surfaces without losing user state"
          git push origin HEAD:main
