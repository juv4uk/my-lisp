name: Verify #441 RED

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  uk-direct-peer-red:
    if: github.event.pull_request.number == 441
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Require migrated UK peer to have no EN bridge
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fqx '(define зчепити string-append)' lib/surface/uk.lisp; then
            echo 'RED 1043: stable UK зчепити still routes through EN string-append in uk.lisp' >&2
            exit 1
          fi
          echo 'GREEN 1043: no UK->EN surface bridge remains'
