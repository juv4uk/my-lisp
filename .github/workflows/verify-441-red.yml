name: Verify #441 RED

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  uk-direct-peer-red:
    if: github.event.pull_request.number == 441
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify-441-red
      - name: Build my-lisp CLI
        run: cargo build -p my-lisp-cli --bin my-lisp
      - name: Require migrated UK peer to have no EN bridge
        run: ./target/debug/my-lisp scripts/check-uk-direct-peer-bridges.lisp
