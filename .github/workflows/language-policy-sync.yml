name: Language policy sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/language-policy-sync.yml"

permissions:
  contents: write

jobs:
  sync-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply reviewed language-policy sync
        env:
          SCRIPT_B64: ""
        run: |
          printf '%s' "$SCRIPT_B64" | base64 -d > /tmp/sync-language-policy.py
          python3 /tmp/sync-language-policy.py
          git diff --check
          git config user.name "Language policy sync"
          git config user.email "85576956+juv4uk@users.noreply.github.com"
          git add AGENTS.md knowledge/guard-reference.wsm .github/workflows/language-policy-sync.yml
          git commit -m "docs(policy): sync UTF-8 language policy into Guard"
          git push
