name: Verify 1045 RED

on:
  pull_request:

permissions:
  contents: read

jobs:
  uk-direct-peer-1045:
    if: github.event.pull_request.head.ref == 'work/chatgpt-uk-peer-1045'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Require 1045 UK peer to have no EN bridge
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fqx '(define текст-порожній? string-empty?)' lib/surface/uk.lisp; then
            echo 'RED 1045: stable UK текст-порожній? still routes through EN string-empty? in uk.lisp' >&2
            exit 1
          fi
          echo 'GREEN 1045: no UK->EN surface bridge remains'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify-1045-peer
      - name: Verify stable EN/UK runtime peers
        run: cargo test -p my-lisp --test uk_surface_equivalence every_stable_uk_surface_entry_resolves_to_its_declared_operation -- --nocapture
      - name: Verify distinct stable UKR spelling executes
        run: cargo test -p my-lisp --test ukr_acceptance ukr_acceptance_program_executes_through_real_runtime -- --nocapture
