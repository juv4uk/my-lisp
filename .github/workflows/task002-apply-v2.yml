name: Apply TASK-002 semantic registry migration v2

on:
  push:
    branches: [refactor/meta-eval-semantic-registry]
    paths:
      - .github/workflows/task002-apply-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/meta-eval-semantic-registry
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Lisp semantic projection
        run: python3 scripts/generate-meta-semantic-registry.py

      - name: Route meta evaluator by semantic identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/meta-eval.my')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'; Finite Contract-6 Canon-name classifier\..*?'
              r'\(def my-canon-identity\n'
              r'  \(lambda \(name\)\n'
              r'    \(cond\n.*?'
              r'      \(t \(quote \(\)\)\)\)\)\)\n',
              re.S,
          )
          if len(pattern.findall(text)) != 1:
              raise SystemExit('Canon classifier block changed')

          replacement = '''; Surface spellings are not owned here. The generated projection loaded before
          ; this evaluator maps every admitted runtime spelling to the numeric semantic ID
          ; from lib/surface/semantic-registry.wsm. This file owns only the mapping from
          ; those opaque IDs to evaluator mechanisms.
          (def my-semantic-id?
            (lambda (name semantic-id)
              (equal? (my-semantic-id-for-surface name) semantic-id)))

          (def my-canon-identity
            (lambda (name)
              (let ((semantic-id (my-semantic-id-for-surface name)))
                (cond
                  ((equal? semantic-id "0001") (quote quote))
                  ((equal? semantic-id "0002") (quote atom))
                  ((equal? semantic-id "0003") (quote eq))
                  ((equal? semantic-id "0004") (quote cons))
                  ((equal? semantic-id "0005") (quote car))
                  ((equal? semantic-id "0006") (quote cdr))
                  ((equal? semantic-id "0007") (quote cond))
                  (t (quote ()))))))

          (def my-lambda-name?
            (lambda (name)
              (my-semantic-id? name "0010")))

          (def my-define-name?
            (lambda (name)
              (my-semantic-id? name "0011")))

          (def my-defmacro-name?
            (lambda (name)
              (my-semantic-id? name "0012")))

          (def my-def-compat-name?
            (lambda (name)
              (my-semantic-id? name "1000")))

          (def my-definition-name?
            (lambda (name)
              (cond
                ((my-define-name? name) t)
                ((my-def-compat-name? name) t)
                (t (quote ())))))
          '''
          text = pattern.sub(replacement, text, count=1)

          replacements = [
              ('((atom (car form)) (eq (car form) (quote lambda)))',
               '((atom (car form)) (my-lambda-name? (car form)))', 1),
              ('((eq (car form) (quote def))',
               '((my-definition-name? (car form))', 2),
              ('((eq (car form) (quote defmacro))',
               '((my-defmacro-name? (car form))', 1),
              ('((eq (car form) (quote lambda))',
               '((my-lambda-name? (car form))', 1),
              ('((eq (car expr) (quote lambda))',
               '((my-lambda-name? (car expr))', 1),
          ]
          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'guard failed for {old!r}: expected {expected}, found {count}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Add canonical meta evaluator loader
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/my-lisp/src/lib.rs')
          text = path.read_text(encoding='utf-8')

          anchor = 'pub const CORE_LIBRARY_SOURCE: &str = include_str!("../../../lib/core.my");\n'
          if text.count(anchor) != 1:
              raise SystemExit('CORE_LIBRARY_SOURCE anchor changed')
          text = text.replace(anchor, anchor + '''

          /// Generated runtime projection of admitted surface spellings to opaque numeric
          /// semantic IDs. semantic-registry.wsm remains the only spelling authority.
          pub const META_SEMANTIC_REGISTRY_SOURCE: &str =
              include_str!("../../../lib/generated/meta-semantic-registry.my");

          /// Metacircular evaluator source. Surface names are supplied by the generated
          /// semantic registry projection rather than duplicated in this file.
          pub const META_EVAL_LIBRARY_SOURCE: &str = include_str!("../../../lib/meta-eval.my");
          ''')

          anchor = '''pub fn load_core_library(session: &mut Session) -> Result<EvalResult, LanguageError> {
              load_macro_library(session)?;
              eval_program(CORE_LIBRARY_SOURCE, session)
          }
          '''
          if text.count(anchor) != 1:
              raise SystemExit('load_core_library anchor changed')
          text = text.replace(anchor, anchor + '''

          /// Load the explicit metacircular self-hosting witness after the ordinary core.
          /// Rust owns bootstrap mechanics; surface admission stays registry-owned.
          pub fn load_meta_evaluator_library(
              session: &mut Session,
          ) -> Result<EvalResult, LanguageError> {
              eval_program(META_SEMANTIC_REGISTRY_SOURCE, session)?;
              eval_program(META_EVAL_LIBRARY_SOURCE, session)
          }
          ''')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Move meta tests onto canonical loader
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('crates/my-lisp/tests')
          include = 'include_str!("../../../lib/meta-eval.my")'
          pattern = re.compile(
              r'(?:my_lisp::)?eval_program\(\s*'
              r'include_str!\("\.\./\.\./\.\./lib/meta-eval\.my"\),\s*'
              r'&mut\s+([A-Za-z_][A-Za-z0-9_]*)\s*\)'
          )
          changed = replaced = 0
          for path in root.glob('*.rs'):
              text = path.read_text(encoding='utf-8')
              new, count = pattern.subn(
                  lambda m: f'my_lisp::load_meta_evaluator_library(&mut {m.group(1)})',
                  text,
              )
              if count:
                  path.write_text(new, encoding='utf-8')
                  changed += 1
                  replaced += count

          leftovers = [
              str(path) for path in root.glob('*.rs')
              if include in path.read_text(encoding='utf-8')
          ]
          if leftovers:
              raise SystemExit('direct include remains in: ' + ', '.join(leftovers))
          if replaced < 8:
              raise SystemExit(f'expected broad bootstrap migration, replaced only {replaced}')
          print(f'migrated {replaced} bootstrap calls across {changed} test files')
          PY

      - name: Add generated projection drift gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          anchor = '      - uses: Swatinem/rust-cache@v2\n      - run: cargo test --workspace\n'
          if text.count(anchor) != 1:
              raise SystemExit('CI test-job anchor changed')
          replacement = '''      - uses: Swatinem/rust-cache@v2
              - name: Check generated meta semantic registry
                run: python3 scripts/generate-meta-semantic-registry.py --check
              - run: cargo test --workspace
          '''
          # Dedent the embedded replacement explicitly; the Python block itself is indented
          # by YAML, but the generated workflow must keep exactly six spaces before '-'.
          replacement = '\n'.join(line[8:] if line.startswith('        ') else line for line in replacement.splitlines()) + '\n'
          if not replacement.startswith('      - uses:'):
              raise SystemExit('internal CI replacement indentation guard failed')
          text = text.replace(anchor, replacement)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Format and verify projection
        run: |
          cargo fmt --all
          python3 scripts/generate-meta-semantic-registry.py --check
          git diff --check

      - name: Focused semantic registry witness
        run: cargo test -p my-lisp --test meta_eval_semantic_registry -- --nocapture

      - name: Full my-lisp integration regression
        run: cargo test -p my-lisp --tests

      - name: Commit migration and remove temporary applicators
        shell: bash
        run: |
          rm -f .github/workflows/task002-apply.yml .github/workflows/task002-apply-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(meta-eval): consume semantic registry projection"
          git push origin HEAD:refactor/meta-eval-semantic-registry
