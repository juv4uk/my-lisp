name: Temporary presentation bool boundary fix

on:
  push:
    branches:
      - fix/presentation-bool-boundary-main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/presentation-bool-boundary-main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch and verify presentation boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/my-lisp/src/presentation.rs')
          s = p.read_text()
          old = '''        let mut session = Session::default();
        let truth = eval_program("(atom 'мама)", &mut session)
            .expect("predicate")
            .value;
'''
          new = '''        // Presentation owns only the human-facing rendering of a value.
        // Do not manufacture a boolean through a Lisp semantic operation such
        // as `atom`: #218 correctly returns a structural result there now.
        let truth = Value::Bool(true);
'''
          if old not in s:
              raise SystemExit('expected presentation test setup not found')
          p.write_text(s.replace(old, new, 1))
          PY
          cargo fmt --check
          cargo test -p my-lisp presentation::tests::ukrainian_value_presentation_changes_only_the_human_view
          git diff --check
      - name: Commit verified focused repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-presentation-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(presentation): decouple bool rendering from atom semantics"
          git push origin HEAD:fix/presentation-bool-boundary-main
