name: Verify atomic journal replacement

on:
  push:
    branches: [fix/swarm-journal-atomic-compaction]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Apply atomic replacement repair
        run: python3 .github/apply-journal-atomic.py
      - name: Focused journal tests
        run: cargo test -p swarm-node journal -- --nocapture
      - name: Workspace tests
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/swarm-node/src/journal.rs
          git commit -m "fix(swarm): publish compacted journal atomically"
          git push origin HEAD:fix/swarm-journal-atomic-compaction
