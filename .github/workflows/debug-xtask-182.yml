name: Debug xtask #182

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  external-oracle:
    name: debug external-oracle CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p xtask --test external_oracle_cli

  xed-tests:
    name: debug XED import tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p xtask --test xed_import_cli

  xed-check:
    name: debug XED generated check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run -p xtask -- import-xed-evidence --check
