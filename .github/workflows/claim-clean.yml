name: Clean claim fix diff

on:
  push:
    branches: [fix/swarm-claim-race]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore unrelated formatting
        run: python3 .github/claim-clean.py
      - name: Commit focused source diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/swarm-node/src/main.rs
          git commit -m "style: keep claim safety diff focused"
          git push origin HEAD:fix/swarm-claim-race
