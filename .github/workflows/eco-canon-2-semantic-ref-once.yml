name: ECO-CANON-2 semantic-ref vertical slice

on:
  push:
    branches:
      - feat/eco-canon-2-semantic-identity-red
    paths:
      - .github/patches/eco-canon-2-semantic-ref.patch
      - .github/workflows/eco-canon-2-semantic-ref-once.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/eco-canon-2-semantic-identity-red
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply semantic-ref slice
        run: |
          awk '
            /^diff --git a\/crates\/my-lisp\/src\/layout.rs / { skip=1; next }
            /^diff --git / && skip { skip=0 }
            !skip { print }
          ' .github/patches/eco-canon-2-semantic-ref.patch > /tmp/eco-canon-2-semantic-ref.patch
          git apply --recount --check /tmp/eco-canon-2-semantic-ref.patch
          git apply --recount /tmp/eco-canon-2-semantic-ref.patch

          perl -0pi -e 's/pub const TAG_NUMERIC_BUFFER: u64 = 13;\n/pub const TAG_NUMERIC_BUFFER: u64 = 13;\n\/\/\/ Process-local implementation pointer; never portable language identity.\npub const TAG_HOST_BUILTIN: u64 = 14;\n/' crates/my-lisp/src/layout.rs
          perl -0pi -e 's~            // TAG_PRIMITIVE was reserved in the memory-layout contract\n            // from day one -- contract 2\.1 finally fills it\.\n            Value::Builtin\(b\) => \{\n                let ptr = Rc::as_ptr\(b\) as u64;\n                NanBox\(Self::pack_ptr\(TAG_PRIMITIVE, ptr\)\)\n            \}~            // Portable primitive identity: numeric semantic ID, not an address\n            // inside this Rust process.\n            Value::SemanticRef(semantic_id) => {\n                let payload = semantic_id\n                    .parse::<u64>()\n                    .expect("semantic registry IDs must be numeric");\n                assert!(payload <= 0x0FFF_FFFF, "semantic ID exceeds NaN-box payload");\n                NanBox(MASK_QNAN | (TAG_PRIMITIVE << 28) | payload)\n            }\n            // Legacy host implementation projection. It gets a distinct tag\n            // so an Rc address can never masquerade as semantic identity.\n            Value::Builtin(b) => {\n                let ptr = Rc::as_ptr(b) as u64;\n                NanBox(Self::pack_ptr(TAG_HOST_BUILTIN, ptr))\n            }~s' crates/my-lisp/src/layout.rs

          grep -q 'Value::SemanticRef(semantic_id)' crates/my-lisp/src/layout.rs
          grep -q 'TAG_HOST_BUILTIN' crates/my-lisp/src/layout.rs
          cargo fmt --all
          git diff --check
      - name: Focused language-power witnesses
        run: |
          cargo test -p my-lisp --test first_class_builtins -- --nocapture
          cargo test -p my-lisp eval::canon::tests:: -- --nocapture
          cargo test -p my-lisp presentation::tests::ukrainian_presentation_localizes_builtin_and_function_markers -- --nocapture
      - name: Full workspace regression
        run: cargo test --workspace
      - name: Workspace build
        run: cargo build --workspace
      - name: Zero-warning Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Repository policy and projection checks
        run: cargo run -p xtask -- verify
      - name: Commit verified vertical slice
        run: |
          rm .github/patches/eco-canon-2-semantic-ref.patch
          rm .github/workflows/eco-canon-2-semantic-ref-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/my-lisp/src/value.rs \
                  crates/my-lisp/src/eval/canon.rs \
                  crates/my-lisp/src/eval/mod.rs \
                  crates/my-lisp/src/eval/closures.rs \
                  crates/my-lisp/src/layout.rs \
                  crates/my-lisp/src/presentation.rs \
                  .github/patches/eco-canon-2-semantic-ref.patch \
                  .github/workflows/eco-canon-2-semantic-ref-once.yml
          git diff --cached --check
          git commit -m "feat(canon): make semantic refs language values"
          git push origin HEAD:feat/eco-canon-2-semantic-identity-red
