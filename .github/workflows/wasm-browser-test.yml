name: WASM Browser Test

on:
  push:
    branches: [main]
    paths:
      - 'crates/my-lisp-wasm/**'
      - '.github/workflows/wasm-test.yml'
  pull_request:
    paths:
      - 'crates/my-lisp-wasm/**'

jobs:
  browser-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Run WASM tests in headless Chrome
        run: wasm-pack test --headless --chrome crates/my-lisp-wasm

      - name: Run WASM tests in headless Firefox
        run: wasm-pack test --headless --firefox crates/my-lisp-wasm
