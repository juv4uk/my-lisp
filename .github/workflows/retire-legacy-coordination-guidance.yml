# trigger: execute once, then self-delete
name: Retire legacy coordination guidance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retire-legacy-coordination-guidance.yml"

permissions:
  contents: write

jobs:
  migrate-guidance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quarantine superseded coordination guidance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          status = Path("ecosystem-status.my")
          text = status.read_text(encoding="utf-8")
          old = '''   a snapshot, refreshed by hand, same as the rest of this file. For
   anything time-sensitive faster than a hand-edit, use notify/poll on
   the my-lisp TCP oracle (127.0.0.1:9999, --protocol=sexpr) — but a
   mailbox ping is a hint to re-read this file or an evidence/ record,
   never itself the durable fact.'''
          new = '''   a snapshot, refreshed by hand, same as the rest of this file. For
   anything time-sensitive faster than a hand-edit, use swarm-node
   (:910x, swarm/1) for coordination. The my-lisp TCP service on :9999 is
   the semantic oracle only (eval/parse/diagnose/contract-version) and
   must not be used as a coordination mailbox.'''
          if old not in text:
              raise SystemExit("expected legacy ecosystem-status guidance not found")
          status.write_text(text.replace(old, new, 1), encoding="utf-8")

          Path("docs/swarm-autonomy.md").write_text('''# Swarm Autonomy v1 — superseded / замінено

This document described the retired coordination design that multiplexed agent
coordination onto the my-lisp `:9999` TCP oracle. **Do not execute commands from
that historical design.** Git history preserves the original document.

Цей документ описував застарілу координацію агентів через TCP oracle `:9999`.
**Не використовуйте команди зі старого дизайну.** Оригінал збережений в історії Git.

Current authority / чинний authority:

- `AGENTS.md` — operational entry point;
- `docs/swarm-mesh-v2.md` — coordination architecture;
- `swarm-node` (`:910x`, `swarm/1`) — coordination plane;
- my-lisp `:9999` — semantic oracle only: `eval`, `parse`, `diagnose`,
  `contract-version` and related oracle operations.

The two planes are intentionally separate. New workflows must never reintroduce
legacy coordination operations on `:9999`.
''', encoding="utf-8")

          Path(".github/workflows/retire-legacy-coordination-guidance.yml").unlink()
          PY
      - name: Commit migration
        run: |
          git config user.name "C5 migration"
          git config user.email "85576956+juv4uk@users.noreply.github.com"
          git add ecosystem-status.my docs/swarm-autonomy.md .github/workflows/retire-legacy-coordination-guidance.yml
          git commit -m "docs(coordination): quarantine legacy :9999 guidance"
          git push
