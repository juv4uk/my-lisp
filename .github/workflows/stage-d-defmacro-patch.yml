name: Stage D defmacro topology patch

on:
  push:
    branches:
      - feat/direct-defmacro-peers

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/direct-defmacro-peers
          fetch-depth: 0
      - name: Patch bootstrap and Ukrainian surface
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          env_path = Path("crates/my-lisp/src/environment.rs")
          env_text = env_path.read_text()
          old_env = (
              "        crate::eval::install_macro_substrate(&session.environment);\n"
              "        crate::eval::eval_program(crate::MACRO_LIBRARY_SOURCE, &mut session)\n"
              "            .expect(\"embedded lib/macro.my must bootstrap a default Session\");\n"
          )
          new_env = (
              "        crate::load_macro_library(&mut session)\n"
              "            .expect(\"embedded lib/macro.my must bootstrap a default Session\");\n"
          )
          if old_env in env_text:
              env_path.write_text(env_text.replace(old_env, new_env, 1))
          elif new_env not in env_text:
              raise SystemExit("Session::default bootstrap block not found")

          uk_path = Path("lib/surface/uk.my")
          uk_text = uk_path.read_text()
          old_uk = (
              "; DEFMACRO is already a first-class macro value installed by macro.my.\n"
              "; This is another name for that same value, not a second macro mechanism.\n"
              "(define визначити-макрос defmacro)\n"
          )
          new_uk = (
              "; 0012: `defmacro` / `визначити-макрос` is a language-owned first-class\n"
              "; Macro value derived by macro.my and bound directly to both public spellings by\n"
              "; the bootstrap loader. It is not redefined here through an English surface.\n"
              "; Sanskrit remains explicitly missing until ratified.\n"
          )
          if old_uk in uk_text:
              uk_path.write_text(uk_text.replace(old_uk, new_uk, 1))
          elif new_uk not in uk_text:
              raise SystemExit("Ukrainian defmacro alias block not found")
          PY

          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/my-lisp/src/environment.rs lib/surface/uk.my
          git commit -m "refactor(macro): centralize peer bootstrap binding"
          git push origin HEAD:feat/direct-defmacro-peers
