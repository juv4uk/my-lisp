name: Runtime peer operator migration

on:
  push:
    branches:
      - feat/runtime-peer-operators
    paths:
      - .github/workflows/runtime-peer-operators.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/runtime-peer-operators
      - name: Apply meaning-first runtime peer slice
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}")
              p.write_text(text.replace(old, new, 1))

          builtins = "crates/my-lisp/src/eval/builtins.rs"
          replace(
              builtins,
              "//! operations stay shadowable lexical values, but peer human spellings may be\n//! installed as direct names of one `Value::Builtin` allocation instead of as\n//! aliases through another human surface. ADD is the first proved slice.\n",
              "//! operations stay shadowable lexical values, but peer human spellings may be\n//! installed as direct names of one `Value::Builtin` allocation instead of as\n//! aliases through another human surface. ADD plus the stable arithmetic and\n//! comparison operator peers are now proved runtime slices.\n",
          )
          replace(
              builtins,
              "fn builtin(name: &'static str, func: Native) -> Value {\n    Value::Builtin(std::rc::Rc::new(crate::value::Builtin { name, func }))\n}\n",
              "fn builtin(name: &'static str, func: Native) -> Value {\n    Value::Builtin(std::rc::Rc::new(crate::value::Builtin { name, func }))\n}\n\nfn define_peer_builtin(\n    environment: &Environment,\n    diagnostic_name: &'static str,\n    names: &[&'static str],\n    func: Native,\n) {\n    let value = builtin(diagnostic_name, func);\n    for name in names {\n        environment.define(*name, value.clone());\n    }\n}\n",
          )
          replace(
              builtins,
              '''    // ADR-007 first ordinary identity: ADD has one callable allocation and\n    // three peer human spellings. `+` is kept as the builtin diagnostic token\n    // and arithmetic selector; no surface resolves through another surface.\n    let add = builtin(\n        "+",\n        std::rc::Rc::new(|args: &[Value], env: &Environment, span: Span| {\n            arithmetic_on_values("+", args, env, span)\n        }),\n    );\n    for name in ["додати", "+", "yoga"] {\n        environment.define(name, add.clone());\n    }\n\n    for op in ["-", "*"] {\n        define!(environment, op, move |args: &[Value], env: &Environment, span: Span| {\n            arithmetic_on_values(op, args, env, span)\n        });\n    }\n    define!(environment, "/", move |args: &[Value], env: &Environment, span: Span| {\n        division_on_values(args, args.len(), env, span)\n    });\n''',
              '''    // ADR-007/008 runtime peer slices: each identity below allocates one\n    // callable value, then binds every ratified stable spelling directly.\n    // The builtin diagnostic token remains the historical symbolic spelling\n    // for Contract 2.1 display compatibility; it is NOT semantic identity.\n    define_peer_builtin(\n        environment,\n        "+",\n        &["додати", "+", "yoga"],\n        std::rc::Rc::new(|args: &[Value], env: &Environment, span: Span| {\n            arithmetic_on_values("+", args, env, span)\n        }),\n    );\n    define_peer_builtin(\n        environment,\n        "-",\n        &["відняти", "-", "viyoga"],\n        std::rc::Rc::new(|args: &[Value], env: &Environment, span: Span| {\n            arithmetic_on_values("-", args, env, span)\n        }),\n    );\n    define_peer_builtin(\n        environment,\n        "*",\n        &["помножити", "*", "guṇana"],\n        std::rc::Rc::new(|args: &[Value], env: &Environment, span: Span| {\n            arithmetic_on_values("*", args, env, span)\n        }),\n    );\n    define_peer_builtin(\n        environment,\n        "/",\n        &["поділити", "/", "haraṇa"],\n        std::rc::Rc::new(|args: &[Value], env: &Environment, span: Span| {\n            division_on_values(args, args.len(), env, span)\n        }),\n    );\n''',
          )
          replace(
              builtins,
              '''    for op in ["<", ">", "="] {\n        define!(environment, op, move |args: &[Value], _env: &Environment, span: Span| {\n            comparison_on_values(op, args, span)\n        });\n    }\n''',
              '''    define_peer_builtin(\n        environment,\n        "<",\n        &["менше?", "<", "hīna?"],\n        std::rc::Rc::new(|args: &[Value], _env: &Environment, span: Span| {\n            comparison_on_values("<", args, span)\n        }),\n    );\n    define_peer_builtin(\n        environment,\n        ">",\n        &["більше?", ">", "adhika?"],\n        std::rc::Rc::new(|args: &[Value], _env: &Environment, span: Span| {\n            comparison_on_values(">", args, span)\n        }),\n    );\n    define_peer_builtin(\n        environment,\n        "=",\n        &["рівне?", "=", "sama?"],\n        std::rc::Rc::new(|args: &[Value], _env: &Environment, span: Span| {\n            comparison_on_values("=", args, span)\n        }),\n    );\n''',
          )

          replace(
              "lib/surface/uk.my",
              '''; ADR-007 / 0104: `додати`, `+`, `yoga` — прямі рівноправні bindings одного\n; callable value. `додати` навмисно НЕ визначається через іншу мовну поверхню.\n(define відняти -)\n(define помножити *)\n(define поділити /)\n''',
              '''; ADR-007/008 / 0104, 1001–1003: `додати`, `відняти`, `помножити`,\n; `поділити`, їхні Sanskrit peers і symbolic notation встановлюються runtime\n; напряму на ті самі callable values. Жодна людська поверхня не є мостом.\n''',
          )
          replace(
              "lib/surface/uk.my",
              '''(define менше? <)\n(define більше? >)\n(define рівне? =)\n(define не-більше? <=)\n''',
              '''; ADR-007/008 / 1014–1016: `менше?`, `більше?`, `рівне?`, їхні\n; Sanskrit peers і symbolic notation є прямими runtime bindings.\n(define не-більше? <=)\n''',
          )

          replace(
              "lib/surface/sa.my",
              '''; ADR-007 / 0104: `додати`, `+`, `yoga` are direct peer bindings of one\n; callable value. yoga is intentionally NOT defined through another surface.\n; viyoga = subtraction (vi- + yoga)\n(define viyoga -)\n; guṇana = multiplication\n(define guṇana *)\n; haraṇa = division operation\n(define haraṇa /)\n''',
              '''; ADR-007/008 / 0104, 1001–1003: yoga, viyoga, guṇana and haraṇa\n; are ratified stable peers installed directly by the runtime together with\n; Ukrainian and symbolic spellings. None is defined through another surface.\n''',
          )
          replace(
              "lib/surface/sa.my",
              '''; hīna = lesser (≠ alpatara min)\n(define hīna? <)\n; adhika = greater (≠ brhattara max)\n(define adhika? >)\n; sama = equal in quantity (≠ abheda eq)\n(define sama? =)\n; na-adhika = not-greater (compound)\n''',
              '''; ADR-007/008 / 1014–1016: hīna?, adhika? and sama? are ratified\n; stable peers installed directly by the runtime with UK and symbolic names.\n; na-adhika = not-greater (compound)\n''',
          )

          replace(
              "crates/my-lisp/src/presentation.rs",
              '''const UK_COVERAGE: &str = include_str!("../../../lib/surface/uk-sa-coverage.wsm");\n''',
              '''const SURFACE_REGISTRY: &str = include_str!("../../../lib/surface/semantic-registry.wsm");\n''',
          )
          replace(
              "crates/my-lisp/src/presentation.rs",
              '''fn uk_names() -> &'static HashMap<&'static str, &'static str> {\n    static NAMES: OnceLock<HashMap<&'static str, &'static str>> = OnceLock::new();\n    NAMES.get_or_init(|| {\n        let mut names = HashMap::new();\n        for line in UK_COVERAGE.lines() {\n            let fields = line.split_whitespace().collect::<Vec<_>>();\n            if fields.first() == Some(&"(entry")\n                && fields.get(5) == Some(&"stable")\n                && fields.get(3) != Some(&"—")\n            {\n                names.insert(fields[2], fields[3]);\n            }\n        }\n        names\n    })\n}\n''',
              '''fn uk_names() -> &'static HashMap<&'static str, &'static str> {\n    static NAMES: OnceLock<HashMap<&'static str, &'static str>> = OnceLock::new();\n    NAMES.get_or_init(|| {\n        let mut names = HashMap::new();\n        for line in SURFACE_REGISTRY.lines() {\n            let fields = line.split_whitespace().collect::<Vec<_>>();\n            let Some(identity_token) = fields.first() else {\n                continue;\n            };\n            let identity = identity_token.trim_start_matches('(');\n            if identity.len() < 4 || !identity.chars().all(|character| character.is_ascii_digit()) {\n                continue;\n            }\n\n            let mut uk = None;\n            let mut stable_spellings = Vec::new();\n            for row in fields[1..].chunks(3) {\n                if row.len() != 3 {\n                    continue;\n                }\n                let surface = row[0].trim_start_matches('(');\n                let name = row[1];\n                let status = row[2].trim_end_matches(')');\n                if status == "stable" && name != "—" {\n                    stable_spellings.push(name);\n                    if surface == "uk" {\n                        uk = Some(name);\n                    }\n                }\n            }\n\n            if let Some(uk) = uk {\n                names.insert(identity, uk);\n                for spelling in stable_spellings {\n                    names.insert(spelling, uk);\n                }\n            }\n        }\n        names\n    })\n}\n''',
          )

          adr = Path("docs/adr/ADR-008-NUMERIC-SURFACE-AUTHORITY.md")
          adr_text = adr.read_text()
          note = '''\n## Runtime peer progress — 2026-09-08\n\nNumeric authority is now consumed by interactive Ukrainian builtin presentation,\nso `presentation.rs` no longer reads the legacy EN-shaped audit table. The first\nstable symbolic arithmetic/comparison wave is also direct at runtime: identities\n`0104`, `1001`–`1003`, and `1014`–`1016` allocate one builtin value each and bind\nUK/SA/symbolic spellings directly. The historical builtin display token remains\na diagnostic compatibility token, not semantic identity.\n'''
          if "## Runtime peer progress — 2026-09-08" not in adr_text:
              adr.write_text(adr_text.rstrip() + "\n" + note)

          Path(".github/workflows/runtime-peer-operators.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(surface): bind stable operator peers directly"
          git push origin HEAD:feat/runtime-peer-operators
