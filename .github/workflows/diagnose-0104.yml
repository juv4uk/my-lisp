name: Diagnose 0104

on:
  push:
    branches:
      - feat/peer-add-identity
    paths:
      - '.github/workflows/diagnose-0104.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Run workspace tests and capture output
        id: tests
        continue-on-error: true
        run: cargo test --workspace > /tmp/test.log 2>&1
      - name: Post diagnostic tail
        if: steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Temporary 0104 workspace diagnostic'
            echo '```text'
            tail -n 260 /tmp/test.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment 6 --body-file /tmp/comment.md
          exit 1
