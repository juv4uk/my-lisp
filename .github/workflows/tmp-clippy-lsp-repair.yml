name: Temporary Clippy LSP repair

on:
  push:
    branches:
      - fix/current-main-ci-baseline

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/current-main-ci-baseline
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply Clippy-prescribed no-semantic-change substitutions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/my-lisp-lsp/src/guard_knowledge.rs')
          text = p.read_text()
          pairs = [
              ('as_symbol(&list[0]).map_or(false, my_lisp::is_define_surface_name)', 'as_symbol(&list[0]).is_some_and(my_lisp::is_define_surface_name)'),
              ('as_symbol(&head[0]).map_or(false, my_lisp::is_define_surface_name)', 'as_symbol(&head[0]).is_some_and(my_lisp::is_define_surface_name)'),
              ('as_symbol(&lambda[0]).map_or(false, my_lisp::is_lambda_surface_name)', 'as_symbol(&lambda[0]).is_some_and(my_lisp::is_lambda_surface_name)'),
          ]
          for old, new in pairs:
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'missing expected expression: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          cargo fmt --all
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/my-lisp-lsp/src/guard_knowledge.rs
          git commit -m "fix(lsp): satisfy current Clippy idioms"
          git push origin HEAD:fix/current-main-ci-baseline
