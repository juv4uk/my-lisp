name: Verify claim-race repair

on:
  push:
    branches: [fix/swarm-claim-race]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Apply transparent patch
        run: git apply --check .github/claim-fix.patch && git apply .github/claim-fix.patch
      - name: Format
        run: cargo fmt --all
      - name: Focused simultaneous-claim regression
        run: cargo test -p swarm-node --test claim_race -- --nocapture
      - name: Workspace tests
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/swarm-node/src/main.rs crates/swarm-node/tests/claim_race.rs
          git commit -m "fix(swarm): serialize local and remote claim promises"
          git push origin HEAD:fix/swarm-claim-race
