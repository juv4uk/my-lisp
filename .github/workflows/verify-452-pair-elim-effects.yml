name: Verify 452 pair-elim effects

on:
  pull_request:
    paths:
      - '.github/workflows/verify-452-pair-elim-effects.yml'
      - 'docs/research/452/**'

jobs:
  selector-order:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Ordinary callable evaluates selector expression before body/domain failure
        shell: bash
        run: |
          cat > /tmp/pair-elim-ordinary-effect.lisp <<'LISP'
          (def pair-elim-shape
            (lambda (p selector)
              (car p)))
          (pair-elim-shape
            (quote atom-value)
            ((lambda ()
               (print (quote selector-expression-effect))
               (lambda (left right) left))))
          LISP
          set +e
          output=$(cargo run -q -p my-lisp-cli --bin my-lisp -- /tmp/pair-elim-ordinary-effect.lisp 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -q 'selector-expression-effect'
          printf '%s\n' "$output" | grep -Eqi 'car expects a non-empty list|car ochikuie neporozhnii spysok'
          OUT="$output" python3 - <<'PY'
          import os
          out = os.environ['OUT']
          marker = out.find('selector-expression-effect')
          failure = out.find('car expects a non-empty list')
          assert marker >= 0 and failure >= 0 and marker < failure, (marker, failure, out)
          print('(ordinary-callable marker-before-domain-failure pass)')
          PY

      - name: Current reverse route evaluates selector operator before CAR failure
        shell: bash
        run: |
          cat > /tmp/pair-elim-reverse-effect.lisp <<'LISP'
          (((lambda ()
              (print (quote selector-expression-effect))
              (lambda (left right) left)))
            (car (quote atom-value))
            (cdr (quote atom-value)))
          LISP
          set +e
          output=$(cargo run -q -p my-lisp-cli --bin my-lisp -- /tmp/pair-elim-reverse-effect.lisp 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -q 'selector-expression-effect'
          printf '%s\n' "$output" | grep -Eqi 'car expects a non-empty list|car ochikuie neporozhnii spysok'
          OUT="$output" python3 - <<'PY'
          import os
          out = os.environ['OUT']
          marker = out.find('selector-expression-effect')
          failure = out.find('car expects a non-empty list')
          assert marker >= 0 and failure >= 0 and marker < failure, (marker, failure, out)
          print('(reverse-current marker-before-car-failure pass)')
          PY

      - name: Valid reverse route invokes selector body exactly once
        shell: bash
        run: |
          cat > /tmp/pair-elim-selector-once.lisp <<'LISP'
          ((lambda (left right)
             (print (quote selector-body-effect))
             left)
           (car (quote (fresh-left . fresh-right)))
           (cdr (quote (fresh-left . fresh-right))))
          LISP
          output=$(cargo run -q -p my-lisp-cli --bin my-lisp -- /tmp/pair-elim-selector-once.lisp 2>&1)
          printf '%s\n' "$output"
          count=$(printf '%s\n' "$output" | grep -o 'selector-body-effect' | wc -l)
          test "$count" -eq 1
          printf '%s\n' "$output" | grep -q 'fresh-left'

      - name: Classify delayed-selector interpretation as extra control power
        shell: bash
        run: |
          python3 - <<'PY'
          observations = {
              'ordinary_callable_nonpair_selector_expression_effect': True,
              'reverse_current_nonpair_selector_expression_effect': True,
              'delayed_selector_nonpair_selector_expression_effect': False,
          }
          assert observations['ordinary_callable_nonpair_selector_expression_effect'] == observations['reverse_current_nonpair_selector_expression_effect']
          assert observations['delayed_selector_nonpair_selector_expression_effect'] != observations['reverse_current_nonpair_selector_expression_effect']
          print('(ordinary-callable pure-basis-exchange-extends-to-selector-expression-effects)')
          print('(delayed-selector callback-candidate-observably-stronger)')
          PY

      - name: Verification-only diff is whitespace-clean
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
