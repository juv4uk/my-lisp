name: Debug 177 RED

on:
  pull_request:
    paths:
      - 'crates/my-lisp/tests/machine_atoms.rs'
      - 'lib/machine/**'
      - '.github/workflows/debug-177-red.yml'

jobs:
  focused-red:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug-177-red
      - run: cargo test -p my-lisp --test machine_atoms -- --nocapture
