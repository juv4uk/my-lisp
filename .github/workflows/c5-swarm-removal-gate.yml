name: C5 Swarm Removal Gate

on:
  push:
    paths:
      - "AGENTS.md"
      - "docs/swarm-*.md"
      - "knowledge/swarm-*.wsm"
      - "crates/my-lisp-cli/src/swarm.rs"
      - "crates/my-lisp-cli/tests/**"
      - "crates/my-lisp/tests/swarm_*.rs"
      - ".github/workflows/c5-swarm-removal-gate.yml"
  pull_request:
    paths:
      - "AGENTS.md"
      - "docs/swarm-*.md"
      - "knowledge/swarm-*.wsm"
      - "crates/my-lisp-cli/src/swarm.rs"
      - "crates/my-lisp-cli/tests/**"
      - "crates/my-lisp/tests/swarm_*.rs"
      - ".github/workflows/c5-swarm-removal-gate.yml"

jobs:
  c5-removal-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Machine-readable migration and fail-closed audit
        run: cargo test -p my-lisp --test swarm_deprecation
      - name: Executable legacy caller inventory
        run: cargo test -p my-lisp --test swarm_live_caller_inventory
      - name: Semantic oracle preservation shield
        run: cargo test -p my-lisp-cli --test semantic_oracle_preservation
