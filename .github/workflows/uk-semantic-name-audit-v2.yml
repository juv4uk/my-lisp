name: Ukrainian semantic naming audit v2

on:
  push:
    branches: [agent/uk-semantic-name-audit]
    paths:
      - '.github/workflows/uk-semantic-name-audit-v2.yml'

permissions:
  contents: write

jobs:
  audit-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/uk-semantic-name-audit
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Make text renames simultaneous
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/.tmp-uk-semantic-name-audit.py')
          text = path.read_text(encoding='utf-8')

          anchor = '''def write(path: str, text: str) -> None:\n    Path(path).write_text(text, encoding="utf-8")\n'''
          helper = '''def write(path: str, text: str) -> None:\n    Path(path).write_text(text, encoding="utf-8")\n\n\ndef replace_names_simultaneously(text: str) -> str:\n    placeholders = []\n    for index, (_en, old, new, _reason) in enumerate(RENAMES):\n        marker = f"__UK_NAME_RENAME_{index}__"\n        assert marker not in text\n        text = text.replace(old, marker)\n        placeholders.append((marker, new))\n    for marker, new in placeholders:\n        text = text.replace(marker, new)\n    return text\n'''
          assert anchor in text
          text = text.replace(anchor, helper, 1)

          old = '''for path in ["lib/surface/uk-docs.wsm", "docs/ukrainian-api.md", "docs/ukrainian-surface-inventory.md"]:\n    text = read(path)\n    for _en, old, new, _reason in RENAMES:\n        text = text.replace(old, new)\n    write(path, text)\n'''
          new = '''for path in ["lib/surface/uk-docs.wsm", "docs/ukrainian-api.md", "docs/ukrainian-surface-inventory.md"]:\n    write(path, replace_names_simultaneously(read(path)))\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''path = "crates/my-lisp/tests/ukrainian_api_docs.rs"\ntext = read(path)\nfor _en, old, new, _reason in RENAMES:\n    text = text.replace(old, new)\n'''
          new = '''path = "crates/my-lisp/tests/ukrainian_api_docs.rs"\ntext = replace_names_simultaneously(read(path))\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''path = "crates/my-lisp/tests/uk_sa_batch2.rs"\ntext = read(path)\nfor _en, old, new, _reason in RENAMES:\n    text = text.replace(old, new)\nwrite(path, text)\n'''
          new = '''path = "crates/my-lisp/tests/uk_sa_batch2.rs"\nwrite(path, replace_names_simultaneously(read(path)))\n'''
          assert old in text
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply semantic and intuitive naming audit
        run: python3 scripts/.tmp-uk-semantic-name-audit.py

      - name: Verify preferred Ukrainian surface
        run: |
          cargo test -p my-lisp --test uk_surface_equivalence
          cargo test -p my-lisp --test ukrainian_api_docs
          cargo test -p my-lisp --test uk_sa_batch2
          cargo test -p my-lisp --test documentation_contract
          cargo test -p my-lisp --test guard

      - name: Verify REPL and browser consumers
        run: |
          cargo test -p my-lisp-cli
          cargo test -p my-lisp-wasm

      - name: Zero-warning gate
        run: cargo clippy -p my-lisp -p my-lisp-cli -p my-lisp-wasm --all-targets -- -D warnings

      - name: Commit tested audit
        run: |
          rm scripts/.tmp-uk-semantic-name-audit.py
          rm .github/workflows/uk-semantic-name-audit.yml
          rm .github/workflows/uk-semantic-name-audit-rerun.yml
          rm .github/workflows/uk-semantic-name-audit-v2.yml
          git add -A
          git config user.name 'juv4uk'
          git config user.email '85576956+juv4uk@users.noreply.github.com'
          git commit -m 'feat(surface): make Ukrainian API names semantically natural'
          git push origin HEAD:agent/uk-semantic-name-audit
