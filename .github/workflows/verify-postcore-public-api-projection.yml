name: Verify public API projection

on:
  push:
    branches:
      - fix/postcore-public-api-projection
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check deterministic public API discovery
        run: python3 scripts/public_api_inventory.py --check
