name: Sync my-lisp language contract into consumer

on:
  workflow_call:
    inputs:
      contract_path:
        description: Vendored language-contract.my path in the consumer repository
        required: false
        type: string
        default: contracts/my-lisp/language-contract.my
      lock_path:
        description: Generated lock record path in the consumer repository
        required: false
        type: string
        default: contracts/my-lisp/lock.my

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: juv4uk/my-lisp
      UPSTREAM_BRANCH: main
      UPSTREAM_PATH: language-contract.my
      TARGET_PATH: ${{ inputs.contract_path }}
      LOCK_PATH: ${{ inputs.lock_path }}
      SYNC_BRANCH: bot/sync-my-lisp-contract
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact upstream contract and write lock
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          # Pin the latest commit that actually changed the contract file.
          # Unrelated my-lisp commits must not create downstream sync PRs.
          contract_revision="$(
            curl -fsSL \
              "https://api.github.com/repos/${UPSTREAM_REPO}/commits?sha=${UPSTREAM_BRANCH}&path=${UPSTREAM_PATH}&per_page=1" \
              | jq -r '.[0].sha'
          )"
          [[ "$contract_revision" =~ ^[0-9a-f]{40}$ ]]

          mkdir -p "$(dirname "$TARGET_PATH")" "$(dirname "$LOCK_PATH")"
          curl -fsSL \
            "https://raw.githubusercontent.com/${UPSTREAM_REPO}/${contract_revision}/${UPSTREAM_PATH}" \
            -o "$TARGET_PATH"

          digest="$(sha256sum "$TARGET_PATH" | awk '{print $1}')"

          cat > "$LOCK_PATH" <<EOF
          ; Generated by juv4uk/my-lisp/.github/workflows/sync-language-contract.yml
          ; This pins the observed upstream authority. It does NOT claim that the
          ; consumer implements the pinned contract version.
          (contract-lock
            (source
              (repository ${UPSTREAM_REPO})
              (branch ${UPSTREAM_BRANCH})
              (path ${UPSTREAM_PATH}))
            (revision "${contract_revision}")
            (sha256 "${digest}"))
          EOF

          if [ -n "$(git status --porcelain -- "$TARGET_PATH" "$LOCK_PATH")" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "contract_revision=${contract_revision}" >> "$GITHUB_OUTPUT"

      - name: Open or update sync PR
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CONTRACT_REVISION: ${{ steps.sync.outputs.contract_revision }}
        shell: bash
        run: |
          set -euo pipefail

          base="${{ github.event.repository.default_branch }}"
          if [ -z "$base" ]; then
            base="$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$SYNC_BRANCH"
          git add "$TARGET_PATH" "$LOCK_PATH"
          git commit -m "chore(contract): sync my-lisp language contract"
          git push --force origin "HEAD:refs/heads/${SYNC_BRANCH}"

          body="$(cat <<EOF
          Automated snapshot of \\`${UPSTREAM_REPO}/${UPSTREAM_PATH}\` at the latest revision that changed that contract:

          \\`${CONTRACT_REVISION}\`

          The vendored file is the observed semantic authority only. Updating it does **not** upgrade this repository's compatibility/conformance claim; that remains an explicit, separately tested decision.
          EOF
          )"

          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" \
              --title "chore(contract): sync my-lisp language contract" \
              --body "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --base "$base" \
              --head "$SYNC_BRANCH" \
              --title "chore(contract): sync my-lisp language contract" \
              --body "$body"
          fi
