name: Refresh meta roadmap once

on:
  push:
    branches:
      - docs/refresh-meta-eval-roadmap

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/refresh-meta-eval-roadmap
      - name: Apply guarded roadmap refresh
        run: python3 scripts/refresh-meta-roadmap-once.py
      - name: Validate patch
        run: |
          git diff --check
          git diff -- PLAN.md
      - name: Commit roadmap refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PLAN.md
          git commit -m "docs(plan): refresh proven meta-evaluator status"
          git push origin HEAD:docs/refresh-meta-eval-roadmap
