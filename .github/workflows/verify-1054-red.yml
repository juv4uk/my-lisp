name: Verify 1054 RED

on:
  push:
    branches:
      - work/chatgpt-uk-peer-1054
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-1054-direct-peer:
    name: Require 1054 UK peer to have no EN bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Require registry-driven topology
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fqx '(define текст-у-кодову-точку string->codepoint)' lib/surface/uk.lisp; then
            echo '1054 RED: stable preferred UK текст-у-кодову-точку still routes through EN string->codepoint' >&2
            exit 1
          fi
          grep -Fqx '(define текст-у-код string->codepoint)' lib/surface/uk.lisp
      - name: Prove stable UK runtime identity
        run: cargo test -p my-lisp --test uk_surface_equivalence every_stable_uk_surface_entry_resolves_to_its_declared_operation -- --exact
