name: Temporary public API projection regeneration

on:
  push:
    branches:
      - fix/public-api-discovery-current-main

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/public-api-discovery-current-main
          fetch-depth: 0
      - name: Regenerate discovery report
        run: python3 scripts/public_api_inventory.py --write-report
      - name: Commit generated projection
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/public-api-discovery.md
          if git diff --cached --quiet; then
            echo "report already current"
            exit 0
          fi
          git commit -m "chore(surface): refresh public API discovery projection"
          git push origin HEAD:fix/public-api-discovery-current-main
