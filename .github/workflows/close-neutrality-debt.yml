name: Close language-neutrality debt

on:
  push:
    branches: [feat/close-language-neutrality-debt]
    paths:
      - '.github/workflows/close-neutrality-debt.yml'

permissions:
  contents: write

jobs:
  close-debt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/close-language-neutrality-debt
          fetch-depth: 0

      - name: Remove symbolic spellings from human rows
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/surface/semantic-registry.wsm')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '(1143 (en — compatibility-only) (uk -> compatibility-only) (sa — compatibility-only) (sym -> compatibility-only))',
              '(1143 (en — compatibility-only) (uk — compatibility-only) (sa — compatibility-only) (sym -> compatibility-only))'
          )
          text = text.replace(
              '(1144 (en — compatibility-only) (uk ->> compatibility-only) (sa — compatibility-only) (sym ->> compatibility-only))',
              '(1144 (en — compatibility-only) (uk — compatibility-only) (sa — compatibility-only) (sym ->> compatibility-only))'
          )
          path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/check_semantic_registry.py

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/close-neutrality-debt.yml
          git add lib/surface/semantic-registry.wsm scripts/check_semantic_registry.py
          git commit -m "test(surface): enforce symbolic and numeric neutrality"
          git push origin HEAD:feat/close-language-neutrality-debt
