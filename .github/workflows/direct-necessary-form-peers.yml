name: Direct necessary-form peer migration

on:
  push:
    branches:
      - feat/direct-necessary-form-peers

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/direct-necessary-form-peers
          fetch-depth: 0
      - name: Remove Ukrainian EN-bridge wrappers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/surface/uk.my")
          text = path.read_text()

          text = text.replace(
              "; Everything below Canon remains language-owned aliases/macros over the same\n"
              "; semantic environment, except identities migrated under ADR-007: those peer\n"
              "; spellings are installed directly by the runtime and are not defined here.\n",
              "; Everything below Canon remains language-owned vocabulary over the same\n"
              "; semantic environment, except identities migrated under ADR-007/008. Necessary\n"
              "; forms 0010/0011 are resolved directly by evaluator identity; migrated ordinary\n"
              "; peer spellings are direct runtime bindings rather than cross-surface aliases.\n",
              1,
          )

          start = text.index(";; Necessary evaluator forms — macros expanding to canonical surfaces")
          marker = "; DEFMACRO is already a first-class macro value installed by macro.my."
          end = text.index(marker, start)
          replacement = """;; Necessary evaluator forms — direct semantic peer spellings
;; Необхідні форми — прямі назви одних семантичних тотожностей
;; ═══════════════════════════════════════════════════════════════

; 0010: `lambda` / `функція` and 0011: `define` / `визначити` are owned by
; the evaluator's necessary-form identity resolver. They are intentionally NOT
; redefined here as macros and neither spelling expands through the other.
; Sanskrit rows remain explicitly missing until ratified.

"""
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/surface/uk.my
          git commit -m "refactor(surface): remove Ukrainian necessary-form bridges"
          git push origin HEAD:feat/direct-necessary-form-peers
