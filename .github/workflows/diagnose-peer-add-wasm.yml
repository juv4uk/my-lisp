name: Diagnose Peer ADD WASM

on:
  push:
    branches:
      - feat/peer-add-identity
    paths:
      - '.github/workflows/diagnose-peer-add-wasm.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Run browser test and capture output
        id: tests
        continue-on-error: true
        run: wasm-pack test --headless --chrome crates/my-lisp-wasm > /tmp/test.log 2>&1
      - name: Post diagnostic tail
        if: steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Temporary WASM diagnostic'
            echo '```text'
            tail -n 180 /tmp/test.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment 6 --body-file /tmp/comment.md
          exit 1
