name: Apply decimal comma signed-zero repair

on:
  push:
    branches: [main]
    paths:
      - scripts/fix-decimal-comma-signed-zero.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Застосувати вузький reader-фікс
        run: python3 scripts/fix-decimal-comma-signed-zero.py

      - name: Перевірити десяткову кому та numeric buffers
        run: |
          cargo test -p my-lisp --test decimal_comma
          cargo test -p my-lisp --test numeric_buffers
          cargo clippy -p my-lisp --all-targets -- -D warnings

      - name: Перевірити, що main не зрушив паралельно
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Зафіксувати кінцевий фікс і прибрати helper
        run: |
          git config user.name juv4uk
          git config user.email 85576956+juv4uk@users.noreply.github.com
          git rm .github/workflows/apply-decimal-comma-signed-zero.yml scripts/fix-decimal-comma-signed-zero.py
          git add crates/my-lisp/src/parser.rs crates/my-lisp/tests/decimal_comma.rs
          git diff --cached --check
          git commit -m "fix(reader): preserve f32 signed zero with decimal comma"
          git push origin HEAD:main
