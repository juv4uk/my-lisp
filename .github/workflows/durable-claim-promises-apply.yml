name: Stage durable claim promise wiring

on:
  push:
    branches: [fix/swarm-durable-claim-promises]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply precise main wiring
        run: python3 .github/apply-durable-claim-promises.py
      - name: Format
        run: cargo fmt --all
      - name: Focused durable promise tests
        run: cargo test -p swarm-node claim_promise -- --nocapture
      - name: Commit wiring if needed
        run: |
          if git diff --quiet; then
            echo "wiring already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/swarm-node/src/main.rs crates/swarm-node/src/claim_promise.rs
          git commit -m "fix(swarm): persist claim vote promises across restart"
          git push origin HEAD:fix/swarm-durable-claim-promises