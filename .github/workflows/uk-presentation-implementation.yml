name: Ukrainian presentation implementation

on:
  push:
    branches: [agent/uk-presentation-surface]
    paths:
      - '.github/workflows/uk-presentation-implementation.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/uk-presentation-surface
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Apply presentation layer
        run: python3 scripts/.tmp-uk-presentation.py

      - name: Format
        run: cargo fmt --all

      - name: Targeted semantic and presentation tests
        run: |
          cargo test -p my-lisp presentation
          cargo test -p my-lisp --test ukrainian_api_docs
          cargo test -p my-lisp-cli
          cargo test -p my-lisp-wasm

      - name: Zero-warning gate
        run: cargo clippy -p my-lisp -p my-lisp-cli -p my-lisp-wasm --all-targets -- -D warnings

      - name: Commit tested implementation
        run: |
          rm scripts/.tmp-uk-presentation.py
          rm .github/workflows/uk-presentation-implementation.yml
          git add -A
          git config user.name 'juv4uk'
          git config user.email '85576956+juv4uk@users.noreply.github.com'
          git commit -m 'feat(repl): localize Ukrainian presentation output'
          git push origin HEAD:agent/uk-presentation-surface
