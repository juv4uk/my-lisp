name: Kernel Call Graph Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/wsm-kernel-call-graph/**'
      - 'crates/wsm-kernel-c-abi/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/kernel-call-graph-test.yml'

jobs:
  call-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test callable graph
        run: cargo test -p wsm-kernel-call-graph -- --nocapture

      - name: Clippy callable graph
        run: cargo clippy -p wsm-kernel-call-graph --all-targets -- -D warnings
