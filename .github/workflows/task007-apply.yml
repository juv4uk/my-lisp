name: Apply TASK-007 result channel

on:
  push:
    branches:
      - fix/meta-eval-argument-error-short-circuit

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/meta-eval-argument-error-short-circuit
          fetch-depth: 0
      - name: Apply guarded Lisp refactor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/meta-eval.my')
          text = path.read_text()

          def replace_between(source, start, end, replacement):
              if source.count(start) != 1:
                  raise SystemExit(f'expected exactly one start marker: {start!r}')
              i = source.index(start)
              j = source.index(end, i)
              return source[:i] + replacement.rstrip() + '\n\n' + source[j:]

          error_block = '''(def my-error
            (lambda (kind detail)
              (list (quote error) kind detail)))'''
          if text.count(error_block) != 1:
              raise SystemExit('my-error anchor drifted')

          helpers = r'''; Internal evaluator outcomes carry provenance that interpreted Lisp data cannot
          ; forge. The tag is a native closure identity, not a symbol or list shape that
          ; a program could reproduce with quote/cons. Public my-eval/my-apply unwrap the
          ; envelope, so the observable interface stays unchanged.
          (def my-result-ok-token
            (lambda (value) value))

          (def my-result-fail-token
            (lambda (value) value))

          (def my-result-ok
            (lambda (value)
              (cons my-result-ok-token value)))

          (def my-result-fail
            (lambda (error)
              (cons my-result-fail-token error)))

          (def my-result-fail?
            (lambda (result)
              (cond
                ((atom result) (quote ()))
                (t (eq (car result) my-result-fail-token)))))

          (def my-result-value
            (lambda (result)
              (cdr result)))'''
          text = text.replace(error_block, error_block + '\n\n' + helpers, 1)

          eval_list = r'''(def my-eval-list-result
            (lambda (exprs env)
              (cond
                ((atom exprs) (my-result-ok (quote ())))
                (t
                 (let ((head-result (my-eval-result (car exprs) env)))
                   (cond
                     ((my-result-fail? head-result) head-result)
                     (t
                      (let ((tail-result (my-eval-list-result (cdr exprs) env)))
                        (cond
                          ((my-result-fail? tail-result) tail-result)
                          (t
                           (my-result-ok
                             (cons
                               (my-result-value head-result)
                               (my-result-value tail-result)))))))))))))

          (def my-eval-list
            (lambda (exprs env)
              (my-result-value (my-eval-list-result exprs env))))'''
          text = replace_between(text, '(def my-eval-list\n', '(def my-eval-body\n', eval_list)

          eval_body = r'''(def my-eval-body-result
            (lambda (body env)
              (cond
                ((atom (cdr body)) (my-eval-result (car body) env))
                (t
                 (let ((first-result (my-eval-result (car body) env)))
                   (cond
                     ((my-result-fail? first-result) first-result)
                     (t (my-eval-body-result (cdr body) env))))))))

          (def my-eval-body
            (lambda (body env)
              (my-result-value (my-eval-body-result body env))))'''
          text = replace_between(text, '(def my-eval-body\n', '(def my-eval-cond\n', eval_body)

          eval_cond = r'''(def my-eval-cond-result
            (lambda (clauses env)
              (cond
                ((atom clauses) (my-result-ok (quote ())))
                (t
                 (let ((test-result (my-eval-result (car (car clauses)) env)))
                   (cond
                     ((my-result-fail? test-result) test-result)
                     ((my-result-value test-result)
                      (my-eval-result (second (car clauses)) env))
                     (t (my-eval-cond-result (cdr clauses) env))))))))

          (def my-eval-cond
            (lambda (clauses env)
              (my-result-value (my-eval-cond-result clauses env))))'''
          text = replace_between(text, '(def my-eval-cond\n', '(def my-take-lambda-def-group\n', eval_cond)

          apply_result = r'''; Internal application returns an outcome envelope. This keeps evaluator
          ; failures distinct from ordinary Lisp data whose printed shape happens to be
          ; `(error ...)`.
          (def my-apply-result
            (lambda (fn args caller-env)
              (cond
                ((atom fn)
                 (my-result-fail (my-error (quote not-callable) fn)))
                ((my-primitive? fn)
                 (my-result-ok (my-apply-primitive (second fn) args)))
                ((my-closure? fn)
                 (cond
                   ((my-arity-ok? (second fn) args)
                    (my-eval-body-result
                      (third fn)
                      (bind-params
                        (second fn)
                        args
                        (my-refresh-shared-frame
                          (my-fourth fn)
                          caller-env))))
                   (t
                    (my-result-fail (my-arity-error (second fn) args)))))
                ((my-recursive-closure? fn)
                 (cond
                   ((my-arity-ok? (third fn) args)
                    (let ((captured
                            (my-refresh-shared-frame
                              (my-fifth fn)
                              caller-env)))
                      (let ((self-env
                              (cons (cons (second fn) fn)
                                    captured)))
                        (my-eval-body-result
                          (my-fourth fn)
                          (bind-params
                            (third fn)
                            args
                            self-env)))))
                   (t
                    (my-result-fail (my-arity-error (third fn) args)))))
                ((my-group-closure? fn)
                 (cond
                   ((my-arity-ok? (third fn) args)
                    (let ((captured
                            (my-refresh-shared-frame
                              (my-sixth fn)
                              caller-env)))
                      (let ((group-env
                              (my-build-group-env (my-fifth fn) captured)))
                        (my-eval-body-result
                          (my-fourth fn)
                          (bind-params
                            (third fn)
                            args
                            group-env)))))
                   (t
                    (my-result-fail (my-arity-error (third fn) args)))))
                ((my-macro? fn)
                 (cond
                   ((my-arity-ok? (second fn) args)
                    (my-eval-body-result
                      (third fn)
                      (bind-params
                        (second fn)
                        args
                        (my-refresh-shared-frame
                          (my-fourth fn)
                          caller-env))))
                   (t
                    (my-result-fail (my-arity-error (second fn) args)))))
                (t
                 (my-result-fail (my-error (quote not-callable) fn))))))

          (def my-apply
            (lambda (fn args . caller-env-rest)
              (let ((caller-env
                      (cond
                        ((atom caller-env-rest) (quote ()))
                        (t (car caller-env-rest)))))
                (my-result-value (my-apply-result fn args caller-env)))))'''
          text = replace_between(text, '(def my-apply\n', '(def my-eval\n', apply_result)

          eval_result = r'''; Evaluate one ordinary application with explicit operator-first and
          ; left-to-right argument sequencing. Recursive evaluation stays inside the
          ; outcome channel until this application has produced a value or its first
          ; failure.
          (def my-eval-application-result
            (lambda (expr env)
              (let ((fn-result (my-eval-result (car expr) env)))
                (cond
                  ((my-result-fail? fn-result) fn-result)
                  (t
                   (let ((fn (my-result-value fn-result)))
                     (cond
                       ((my-macro? fn)
                        (cond
                          ((my-arity-ok? (second fn) (cdr expr))
                           (let ((expansion-result
                                   (my-apply-result fn (cdr expr) env)))
                             (cond
                               ((my-result-fail? expansion-result) expansion-result)
                               (t
                                (my-eval-result
                                  (my-result-value expansion-result)
                                  env)))))
                          (t
                           (my-result-fail
                             (my-arity-error (second fn) (cdr expr))))))
                       (t
                        (let ((args-result
                                (my-eval-list-result (cdr expr) env)))
                          (cond
                            ((my-result-fail? args-result) args-result)
                            (t
                             (my-apply-result
                               fn
                               (my-result-value args-result)
                               env))))))))))))

          (def my-eval-result
            (lambda (expr env)
              (cond
                ((atom expr)
                 (cond
                   ((my-unresolved-name? expr env)
                    (my-result-fail
                      (my-error (quote unbound-symbol) expr)))
                   (t
                    (my-result-ok (env-lookup expr env)))))
                ((atom (car expr))
                 (cond
                   ((my-canon-quote-name? (car expr))
                    (my-result-ok (second expr)))
                   ((my-canon-cond-name? (car expr))
                    (my-eval-cond-result (cdr expr) env))
                   ((eq (car expr) (quote lambda))
                    (let ((problem (my-lambda-list-error (second expr))))
                      (cond
                        ((atom problem)
                         (my-result-ok
                           (my-make-closure
                             (second expr)
                             (cdr (cdr expr))
                             env)))
                        (t
                         (my-result-fail
                           (my-lambda-invalid-form problem))))))
                   (t
                    (my-eval-application-result expr env))))
                (t
                 (my-eval-application-result expr env)))))

          (def my-eval
            (lambda (expr env)
              (my-result-value (my-eval-result expr env))))'''
          text = replace_between(text, '(def my-eval\n', '; Top-level sequencing.', eval_result)

          path.write_text(text)
          PY

      - name: Focused TASK-007 proof
        run: cargo test -p my-lisp --test meta_eval_evidence application_evaluation_order_preserves_the_first_error
      - name: Meta-evaluator regression suite
        run: cargo test -p my-lisp --test meta_eval_evidence
      - name: Commit guarded result-channel change
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/meta-eval.my
          git rm .github/workflows/task007-apply.yml
          git commit -m "fix(meta-eval): preserve first evaluation failure"
          git push origin HEAD:fix/meta-eval-argument-error-short-circuit
