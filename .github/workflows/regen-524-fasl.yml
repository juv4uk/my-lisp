name: Regenerate core FASL for #524

on:
  pull_request:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.ref == 'fix/524-regenerate-core-fasl'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fix-524-fasl
      - name: Regenerate FASL from current core source
        run: cargo run --release -p my-lisp-cli --bin gen-fasl -- lib/core.lisp lib/core.lisp.fasl
      - name: Commit regenerated binary if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/core.lisp.fasl; then
            echo "FASL already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core.lisp.fasl
          git commit -m "chore(fasl): regenerate after current core changes"
          git push origin HEAD:fix/524-regenerate-core-fasl
