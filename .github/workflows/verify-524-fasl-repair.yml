name: Verify #524 FASL repair

on:
  pull_request:

permissions:
  contents: read

jobs:
  fasl-and-cli:
    if: github.event.pull_request.head.ref == 'fix/524-regenerate-core-fasl'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify-524-fasl-repair
      - name: Direct FASL freshness
        run: cargo test -p my-lisp --test core_fasl_freshness -- --nocapture
      - name: Full CLI black-box suite
        run: cargo test -p my-lisp-cli --test cli -- --nocapture
