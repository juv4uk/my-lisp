name: Verify 1053 RED

on:
  push:
    branches:
      - work/chatgpt-uk-peer-1053
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-1053-direct-peer:
    name: Require 1053 UK peer to have no EN bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Require registry-driven topology
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fqx '(define кодова-точка-у-текст codepoint->string)' lib/surface/uk.lisp; then
            echo '1053 RED: stable preferred UK кодова-точка-у-текст still routes through EN codepoint->string' >&2
            exit 1
          fi
          grep -Fqx '(define код-у-текст codepoint->string)' lib/surface/uk.lisp
      - name: Prove stable UK runtime identity
        run: cargo test -p my-lisp --test uk_surface_equivalence every_stable_uk_surface_entry_resolves_to_its_declared_operation -- --exact
