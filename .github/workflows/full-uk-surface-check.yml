name: Full Ukrainian Surface Gate

on:
  pull_request:
    paths:
      - 'lib/surface/semantic-registry.wsm'
      - 'lib/surface/український-профіль-джерела.всм'
      - 'scripts/generate-function-table.my'
      - 'scripts/generate-meta-semantic-registry.py'
      - 'lib/generated/function-table.wsm'
      - 'lib/generated/meta-semantic-registry.my'
      - 'docs/generated/function-table.md'
      - 'crates/my-lisp/src/semantic_registry.rs'
      - 'crates/my-lisp/tests/full_uk_surface.rs'
      - 'crates/my-lisp-cli/tests/uk_surface_audit_projection.rs'
      - '.github/workflows/full-uk-surface-check.yml'
  push:
    branches:
      - main
    paths:
      - 'lib/surface/semantic-registry.wsm'
      - 'lib/surface/український-профіль-джерела.всм'
      - 'scripts/generate-function-table.my'
      - 'scripts/generate-meta-semantic-registry.py'
      - 'lib/generated/function-table.wsm'
      - 'lib/generated/meta-semantic-registry.my'
      - 'docs/generated/function-table.md'
      - 'crates/my-lisp/src/semantic_registry.rs'
      - 'crates/my-lisp/tests/full_uk_surface.rs'
      - 'crates/my-lisp-cli/tests/uk_surface_audit_projection.rs'
      - '.github/workflows/full-uk-surface-check.yml'

permissions:
  contents: write

concurrency:
  group: full-uk-surface-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate function-table projections
        run: cargo run -p my-lisp-cli --bin my-lisp -- scripts/generate-function-table.my
      - name: Regenerate meta semantic registry projection
        run: python3 scripts/generate-meta-semantic-registry.py
      - name: Upload exact regenerated projections
        uses: actions/upload-artifact@v4
        with:
          name: full-uk-generated-projections
          path: |
            lib/generated/function-table.wsm
            lib/generated/meta-semantic-registry.my
            docs/generated/function-table.md
      - name: Commit exact regenerated projections
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- lib/generated/function-table.wsm lib/generated/meta-semantic-registry.my docs/generated/function-table.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/generated/function-table.wsm lib/generated/meta-semantic-registry.my docs/generated/function-table.md
          git commit -m 'chore(uk): regenerate surface projections'
          git push origin HEAD:${{ github.head_ref }}
      - name: Require committed projections to match generators
        run: git diff --exit-code -- lib/generated/function-table.wsm lib/generated/meta-semantic-registry.my docs/generated/function-table.md
      - name: Reject Latin letters in full Ukrainian candidates first
        run: cargo test -p my-lisp-cli --test uk_surface_audit_projection full_uk_candidates_need_no_latin_keyboard_layout -- --nocapture
      - name: Verify authoritative full Ukrainian peer identity
        run: cargo test -p my-lisp --test full_uk_surface -- --nocapture
      - name: Check all full Ukrainian staging invariants
        run: cargo test -p my-lisp-cli --test uk_surface_audit_projection -- --nocapture
