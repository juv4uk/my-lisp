name: Verify 1058 RED

on:
  push:
    branches:
      - work/chatgpt-uk-peer-1058
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-1058-direct-peer:
    name: Require 1058 UK peer to have no EN bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Require registry-driven topology
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fqx '(define показати princ)' lib/surface/uk.lisp; then
            echo '1058 RED: stable UK показати still routes through EN princ' >&2
            exit 1
          fi
      - name: Prove stable UK runtime identity
        run: cargo test -p my-lisp --test uk_surface_equivalence every_stable_uk_surface_entry_resolves_to_its_declared_operation -- --exact
