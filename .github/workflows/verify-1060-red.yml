name: Verify 1060 RED

on:
  push:
    branches:
      - work/chatgpt-uk-peer-1060
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-1060-direct-peer:
    name: Require 1060 UK peer to have no EN bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Require registry-driven topology
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fqx '(define прочитати-усе read-all)' lib/surface/uk.lisp; then
            echo '1060 RED: stable UK прочитати-усе still routes through EN read-all' >&2
            exit 1
          fi
      - name: Prove stable UK runtime identity
        run: cargo test -p my-lisp --test uk_surface_equivalence every_stable_uk_surface_entry_resolves_to_its_declared_operation -- --exact
