name: Authority Guard Self-Test

on:
  pull_request:
    paths:
      - ".github/workflows/authority-guard-self-test.yml"
      - "scripts/authority-guard.lisp"
      - "scripts/authority-guard-enforce.lisp"
      - "tests/authority-inventory.lisp"
      - "tests/fixtures/authority-guard/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/authority-guard-self-test.yml"
      - "scripts/authority-guard.lisp"
      - "scripts/authority-guard-enforce.lisp"
      - "tests/authority-inventory.lisp"
      - "tests/fixtures/authority-guard/**"
  workflow_dispatch:

jobs:
  self-test:
    name: forbidden fails, mechanism passes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: authority-guard-self-test

      - name: Build my-lisp transport
        run: cargo build -p my-lisp-cli --bin my-lisp

      - name: DEBUG — isolate CLI startup from authority guard
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '(print (quote DEBUG-STARTUP-OK))' > tests/debug-startup.lisp
          ./target/debug/my-lisp tests/debug-startup.lisp

      - name: DEBUG — isolate read-file layers
        shell: bash
        run: |
          set +e
          printf '%s\n'             '(print (quote DEBUG-BEFORE-BYTES))'             '(print (car (read-file-bytes "tests/authority-inventory.lisp")))'             > tests/debug-read-bytes.lisp
          ./target/debug/my-lisp tests/debug-read-bytes.lisp
          echo "DEBUG-READ-BYTES-EXIT=$?"

          printf '%s\n'             '(print (quote DEBUG-BEFORE-UTF8))'             '(print (car (utf8-decode (read-file-bytes "tests/authority-inventory.lisp"))))'             > tests/debug-read-utf8.lisp
          ./target/debug/my-lisp tests/debug-read-utf8.lisp
          echo "DEBUG-READ-UTF8-EXIT=$?"

          printf '%s\n'             '(print (quote DEBUG-BEFORE-READ-FILE))'             '(print (read-file "tests/authority-inventory.lisp"))'             > tests/debug-read-file.lisp
          ./target/debug/my-lisp tests/debug-read-file.lisp
          echo "DEBUG-READ-FILE-EXIT=$?"
          set -e

      - name: DEBUG — four-level read path
        shell: bash
        run: |
          set +e
          printf '%s\n' '(print (reverse (quote (1 2 3))))' > tests/debug-reverse.lisp
          ./target/debug/my-lisp tests/debug-reverse.lisp
          echo "DEBUG-REVERSE-EXIT=$?"

          printf '%s\n'             '(print (quote DEBUG-BEFORE-UTF8-LITERAL))'             '(print (car (utf8-decode (quote (97 98 99)))))'             > tests/debug-utf8-literal.lisp
          ./target/debug/my-lisp tests/debug-utf8-literal.lisp
          echo "DEBUG-UTF8-LITERAL-EXIT=$?"

          printf '%s\n'             '(print (quote DEBUG-BEFORE-BYTES))'             '(print (car (read-file-bytes "tests/authority-inventory.lisp")))'             > tests/debug-bytes.lisp
          ./target/debug/my-lisp tests/debug-bytes.lisp
          echo "DEBUG-BYTES-EXIT=$?"

          printf '%s\n'             '(print (quote DEBUG-BEFORE-READFILE))'             '(print (read-file "tests/authority-inventory.lisp"))'             > tests/debug-readfile.lisp
          ./target/debug/my-lisp tests/debug-readfile.lisp
          echo "DEBUG-READFILE-EXIT=$?"
          set -e

      - name: Forbidden semantic fixture is diagnosed and rejected
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            '(change "tests/fixtures/authority-guard/forbidden-semantic.rs" modified)' \
            > tests/changed-host-tests.lisp

          ./target/debug/my-lisp scripts/authority-guard.lisp > tests/authority-verdict.lisp
          cat tests/authority-verdict.lisp
          grep -q 'semantic-authority-violation' tests/authority-verdict.lisp

          if ./target/debug/my-lisp scripts/authority-guard-enforce.lisp > /tmp/authority-forbidden.log 2>&1; then
            echo 'ERROR: forbidden semantic fixture was accepted'
            cat /tmp/authority-forbidden.log
            exit 1
          fi
          cat /tmp/authority-forbidden.log

      - name: Allowed mechanism fixture is accepted
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            '(change "tests/fixtures/authority-guard/allowed-mechanism.rs" modified)' \
            > tests/changed-host-tests.lisp

          ./target/debug/my-lisp scripts/authority-guard.lisp > tests/authority-verdict.lisp
          cat tests/authority-verdict.lisp
          grep -q 'authority-ok' tests/authority-verdict.lisp
          ./target/debug/my-lisp scripts/authority-guard-enforce.lisp
