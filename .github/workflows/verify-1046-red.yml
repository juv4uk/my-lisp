name: Verify 1046 RED

on:
  pull_request:

permissions:
  contents: read

jobs:
  uk-peer-1046:
    if: github.event.pull_request.head.ref == 'work/chatgpt-uk-peer-1046'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Require 1046 UK peer to have no EN bridge
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fqx '(define префікс-тексту? string-prefix?)' lib/surface/uk.lisp; then
            echo '1046 RED: stable UK префікс-тексту? still routes through EN string-prefix?' >&2
            exit 1
          fi
      - name: Prove stable surface identity after topology passes
        run: cargo test -p my-lisp --test uk_surface_equivalence -- --nocapture
