name: Immutable Canon Clean Finalize

on:
  push:
    branches:
      - feat/immutable-canon-clean

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/immutable-canon-clean
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply Contract 6 finalizer
        run: python3 scripts/finalize-immutable-canon.py
      - name: Regenerate constitution
        run: cargo run -p my-lisp-cli --bin my-lisp -- scripts/build-constitution.my > /tmp/constitution.my && mv /tmp/constitution.my my-lisp-constitution.my
      - name: Regenerate fixture inventory
        run: cargo run -p my-lisp-cli --bin my-lisp -- scripts/build-inventory.my > /tmp/inventory.my && mv /tmp/inventory.my tests/fixtures/inventory.my
      - name: Check warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Build workspace
        run: cargo build --workspace
      - name: Commit clean Contract 6 evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f immutable-canon-clippy.log immutable-canon-tests.log
          git rm .github/workflows/immutable-canon-finalize.yml scripts/finalize-immutable-canon.py
          git add crates/my-lisp/src/eval/builtins.rs crates/my-lisp/src/eval/canon.rs crates/my-lisp/src/eval/mod.rs crates/my-lisp/src/value.rs crates/my-lisp/tests/canon_adversarial.rs docs/adr/ADR-004-CLOSED-MCCARTHY7-CORE.md tests/fixtures/conformance.my my-lisp-constitution.my tests/fixtures/inventory.my
          git add -u immutable-canon-clippy.log immutable-canon-tests.log || true
          git commit -m "chore(canon): ratify Contract 6 executable evidence"
          git push origin HEAD:feat/immutable-canon-clean
