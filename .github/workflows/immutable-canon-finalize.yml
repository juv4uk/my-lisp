name: Immutable Canon Finalize

on:
  push:
    branches:
      - feat/immutable-canon

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/immutable-canon
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply Contract 6 finalizer
        run: python3 scripts/finalize-immutable-canon.py
      - name: Regenerate constitution
        run: cargo run -p my-lisp-cli --bin my-lisp -- scripts/build-constitution.my > /tmp/constitution.my && mv /tmp/constitution.my my-lisp-constitution.my
      - name: Regenerate fixture inventory
        run: cargo run -p my-lisp-cli --bin my-lisp -- scripts/build-inventory.my > /tmp/inventory.my && mv /tmp/inventory.my tests/fixtures/inventory.my
      - name: Apply and verify Rust formatting
        run: cargo fmt --all && cargo fmt --all -- --check
      - name: Check warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Build workspace
        run: cargo build --workspace
      - name: Commit final evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(canon): ratify Contract 6 executable evidence"
            git push origin HEAD:feat/immutable-canon
          fi
