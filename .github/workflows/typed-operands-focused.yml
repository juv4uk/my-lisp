name: typed operands focused

on:
  push:
    branches: [feat/177-typed-operands]
  workflow_dispatch:

jobs:
  typed-operands:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p my-lisp --test machine_typed_operands
