name: Host ABI regression

on:
  pull_request:
    paths:
      - "crates/my-lisp-host/src/native_exec.rs"
      - "crates/my-lisp-host/tests/native_guest_abi.rs"
      - ".github/workflows/host-abi.yml"
  push:
    branches: [main]
    paths:
      - "crates/my-lisp-host/src/native_exec.rs"
      - "crates/my-lisp-host/tests/native_guest_abi.rs"
      - ".github/workflows/host-abi.yml"
  workflow_dispatch:

jobs:
  guest-abi-isolation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: host-abi-${{ matrix.os }}
      - name: Guest ABI isolation witness
        run: cargo test -p my-lisp-host --test native_guest_abi -- --nocapture
