name: Fix surface catalog clippy

on:
  push:
    branches: [feat/close-language-neutrality-debt]
    paths:
      - '.github/workflows/fix-surface-catalog-clippy.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/close-language-neutrality-debt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Apply focused clippy fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/my-lisp-cli/src/repl/surface_catalog.rs')
          text = p.read_text(encoding='utf-8')
          old = 'for triple in fields[1..].chunks_exact(3) {'
          new = 'for triple in fields[1..].as_chunks::<3>().0 {'
          if text.count(old) != 1:
              raise SystemExit(f'expected one clippy target, found {text.count(old)}')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          cargo clippy -p my-lisp-cli --all-targets -- -D warnings
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-surface-catalog-clippy.yml
          git add crates/my-lisp-cli/src/repl/surface_catalog.rs
          git commit -m "fix(repl): satisfy strict clippy for numeric registry parser"
          git push origin HEAD:feat/close-language-neutrality-debt
