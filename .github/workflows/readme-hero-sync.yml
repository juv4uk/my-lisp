name: README hero sync

on:
  push:
    paths:
      - ".github/workflows/readme-hero-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply README hero layout
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          hero_anchor = '<div align="center">\n\n# my-lisp'
          hero_block = '''<div align="center">\n\n<img src="docs/assets/wsm-quadrivium-hero.webp" alt="WSM над квадривіумом — арифметика, геометрія, музика й астрономія" width="100%">\n\n# my-lisp'''
          if text.count(hero_anchor) != 1:
              raise SystemExit(f"hero anchor count != 1: {text.count(hero_anchor)}")
          text = text.replace(hero_anchor, hero_block, 1)

          tagline = '*Дослідження того, наскільки малою може бути незвідна машина, якщо дедалі більше значення, правил і поведінки належить самій мові.*'
          web_cta = '''*Дослідження того, наскільки малою може бути незвідна машина, якщо дедалі більше значення, правил і поведінки належить самій мові.*\n\n<p><a href="https://github.com/juv4uk/my-lisp/releases/latest/download/my-lisp-cli-web.html"><strong>▶ Спробувати my-lisp у вебі</strong></a></p>\n<sub>Один автономний portable-файл <code>.html</code> · без встановлення · працює локально у браузері</sub>'''
          if text.count(tagline) != 1:
              raise SystemExit(f"tagline count != 1: {text.count(tagline)}")
          text = text.replace(tagline, web_cta, 1)

          old_quick = '''## Швидкий старт\n\n**Спробувати `my-lisp` можна без встановлення:**  \n[**завантажити автономний web-REPL**](https://github.com/juv4uk/my-lisp/releases/latest/download/my-lisp-cli-web.html)\n\nЦе один portable-файл `.html` із термінальним REPL, який працює локально у браузері.\n\n### Запуск із вихідного коду\n'''
          if text.count(old_quick) != 1:
              raise SystemExit(f"quick-start block count != 1: {text.count(old_quick)}")
          text = text.replace(old_quick, '## Локальний запуск\n', 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify README layout
        run: |
          grep -F 'docs/assets/wsm-quadrivium-hero.webp' README.md
          grep -F '▶ Спробувати my-lisp у вебі' README.md
          grep -F '## Локальний запуск' README.md
          test "$(grep -c 'releases/latest/download/my-lisp-cli-web.html' README.md)" -eq 1

      - name: Commit reviewed README update
        run: |
          rm .github/workflows/readme-hero-sync.yml
          git config user.name "juv4uk"
          git config user.email "85576956+juv4uk@users.noreply.github.com"
          git add README.md .github/workflows/readme-hero-sync.yml
          git commit -m "docs(readme): add WSM quadrivium hero and web entry"
          git push
