name: Clean Ukrainian presentation diff

on:
  push:
    branches: [agent/uk-presentation-surface]
    paths:
      - '.github/workflows/uk-presentation-clean-diff.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/uk-presentation-surface
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Revert unrelated formatter churn
        shell: bash
        run: |
          set -euo pipefail
          base=8a0e126fd184f6888b2d8c78ea83f2d5c75d424a
          keep='^(crates/my-lisp/src/presentation.rs|crates/my-lisp/src/lib.rs|lib/surface/uk.my|crates/my-lisp-cli/src/repl.rs|crates/my-lisp-wasm/src/lib.rs|public/my-lisp-cli-web.html|crates/my-lisp/tests/ukrainian_api_docs.rs|docs/repl-surfaces.md)$'
          while IFS= read -r path; do
            if [[ "$path" =~ $keep ]]; then
              continue
            fi
            if git cat-file -e "$base:$path" 2>/dev/null; then
              git checkout "$base" -- "$path"
            else
              rm -f -- "$path"
            fi
          done < <(git diff --name-only "$base"...HEAD)
          rm -f .github/workflows/uk-presentation-clean-diff.yml

      - name: Verify narrow diff
        shell: bash
        run: |
          set -euo pipefail
          base=8a0e126fd184f6888b2d8c78ea83f2d5c75d424a
          unexpected=$(git diff --name-only "$base" | grep -Ev '^(crates/my-lisp/src/presentation.rs|crates/my-lisp/src/lib.rs|lib/surface/uk.my|crates/my-lisp-cli/src/repl.rs|crates/my-lisp-wasm/src/lib.rs|public/my-lisp-cli-web.html|crates/my-lisp/tests/ukrainian_api_docs.rs|docs/repl-surfaces.md)$' || true)
          if [ -n "$unexpected" ]; then
            printf 'Unexpected files remain:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Re-run focused verification
        run: |
          cargo test -p my-lisp presentation
          cargo test -p my-lisp --test ukrainian_api_docs
          cargo test -p my-lisp-cli
          cargo test -p my-lisp-wasm
          cargo clippy -p my-lisp -p my-lisp-cli -p my-lisp-wasm --all-targets -- -D warnings

      - name: Commit clean diff
        run: |
          git add -A
          git config user.name 'juv4uk'
          git config user.email '85576956+juv4uk@users.noreply.github.com'
          git commit -m 'chore(repl): remove unrelated rustfmt churn'
          git push origin HEAD:agent/uk-presentation-surface
