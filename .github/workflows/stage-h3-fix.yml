name: Stage H3 fix

on:
  push:
    branches: [refactor/stage-h3-semantic-tooling-discovery]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/stage-h3-semantic-tooling-discovery
      - name: Keep synthetic stable projection test-only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/my-lisp/src/semantic_registry.rs')
          text = p.read_text()
          old = 'pub(crate) fn stable_surfaces_for_semantic_id_from_source(\n'
          assert text.count(old) == 1
          text = text.replace(old, '#[cfg(test)]\n' + old, 1)
          p.write_text(text)
          PY
          rm .github/workflows/stage-h3-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/my-lisp/src/semantic_registry.rs .github/workflows/stage-h3-fix.yml
          git commit -m "fix(tooling): keep synthetic registry helper test-only"
          git push
