name: C5 physical removal helper

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/c5-physical-removal.yml"

permissions:
  contents: write

jobs:
  remove-legacy-coordination:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Recover the reviewed fail-closed surgery recipe
        run: |
          git show 69b65a628683573790a5af675d27433fa69968c7:.github/workflows/c5-physical-removal.yml > /tmp/c5-recipe.yml
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/c5-recipe.yml').read_text(encoding='utf-8').splitlines(keepends=True)
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          out = []
          in_triple = False
          for line in lines[start:end]:
              if not in_triple and line.startswith('          '):
                  line = line[10:]
              out.append(line)
              if line.count('"""') % 2 == 1:
                  in_triple = not in_triple
          if in_triple:
              raise SystemExit('unterminated triple-quoted marker in recovered recipe')
          Path('/tmp/c5-remove.py').write_text(''.join(out), encoding='utf-8')
          PY
          test -s /tmp/c5-remove.py
          grep -q 'legacy surface survived surgery' /tmp/c5-remove.py
          python3 -m py_compile /tmp/c5-remove.py
      - name: Apply physical removal in the worktree
        run: |
          python3 /tmp/c5-remove.py
          rm .github/workflows/c5-physical-removal.yml
          cargo fmt --all
          git diff --check
      - name: Prove zero legacy compatibility callers
        run: cargo test -p my-lisp --test swarm_live_caller_inventory
      - name: Preserve semantic oracle behavior
        run: cargo test -p my-lisp-cli --test semantic_oracle_preservation
      - name: Preserve the remaining CLI protocol suite
        run: cargo test -p my-lisp-cli --test cli
      - name: Check semantic-oracle crate compiles cleanly
        run: cargo check -p my-lisp-cli
      - name: Commit atomic C5 removal
        run: |
          git config user.name "C5 removal"
          git config user.email "85576956+juv4uk@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(swarm): remove legacy :9999 coordination surface"
          git push
