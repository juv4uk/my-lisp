name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    name: cargo clippy --workspace (zero warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check generated meta semantic registry
        run: python3 scripts/generate-meta-semantic-registry.py --check
      - run: cargo test --workspace
      - run: cargo build --workspace
      - name: Check Ukrainian full-word source profile with my-lisp
        run: ./target/debug/my-lisp scripts/перевірити-український-профіль.всм

  meta-advice-release:
    name: full Advice Taker native/meta parity (optimized)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: meta-advice-ci-meta
      - name: Run full vertical witness with speed-oriented native profile
        run: cargo test --profile ci-meta -p my-lisp --test meta_eval_advice_taker real_advice_taker_stack_has_exact_native_meta_parity -- --ignored --nocapture

  web-repl:
    name: portable web REPL build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.15.0'
      - name: Build WASM bindings
        run: wasm-pack build crates/my-lisp-wasm --target web --out-dir ../../public/wasm
      - name: Bundle standalone HTML
        run: |
          node scripts/make-portable-web.mjs public/my-lisp-cli-web.html my-lisp-cli-web.html
          test -s my-lisp-cli-web.html
