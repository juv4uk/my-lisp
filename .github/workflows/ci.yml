name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  clippy:
    name: cargo clippy --workspace (zero warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: B5 full-scan diagnostic profile
        run: cargo test -p my-lisp --test reason_scale reason_scale_profile_default_stack_100_500_1000 -- --nocapture
      - name: B5 Advice Taker diagnostic profile
        run: cargo test -p my-lisp --test reason_advice_scale advice_taker_profile_100_500_1000_distractors -- --nocapture
      - run: cargo build --workspace
