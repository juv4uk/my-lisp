name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  clippy:
    name: cargo clippy --workspace (zero warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check generated meta semantic registry
        run: python3 scripts/generate-meta-semantic-registry.py --check
      - run: cargo test --workspace
      - name: B5 full-scan diagnostic profile
        run: cargo test -p my-lisp --test reason_scale reason_scale_profile_default_stack_100_500_1000 -- --nocapture
      - name: B5 Advice Taker diagnostic profile
        run: cargo test -p my-lisp --test reason_advice_scale advice_taker_profile_100_500_1000_distractors -- --ignored --nocapture
      - run: cargo build --workspace

  web-repl:
    name: portable web REPL build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.15.0'
      - name: Build WASM bindings
        run: wasm-pack build crates/my-lisp-wasm --target web --out-dir ../../public/wasm
      - name: Bundle standalone HTML
        run: |
          node scripts/make-portable-web.mjs public/my-lisp-cli-web.html my-lisp-cli-web.html
          test -s my-lisp-cli-web.html
