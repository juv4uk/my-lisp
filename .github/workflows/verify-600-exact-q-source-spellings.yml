name: Verify 600 exact-Q source spellings

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/verify-600-exact-q-source-spellings.yml'

jobs:
  exact-q-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Exact-Q binary contract
        run: cargo test -p my-lisp --test exact_q_binary_contract -- --nocapture
      - name: Child diff hygiene
        run: git diff --check HEAD^ HEAD
