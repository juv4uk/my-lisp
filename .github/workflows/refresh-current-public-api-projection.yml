name: Refresh current public API projection

on:
  push:
    branches: [fix/current-main-public-api-projection]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/current-main-public-api-projection
          fetch-depth: 0
      - name: Regenerate deterministic projection
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/public_api_inventory.py --write-report
          python3 scripts/public_api_inventory.py --check
          git diff --check
      - name: Commit generated report only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/refresh-current-public-api-projection.yml
          git add docs/generated/public-api-discovery.md .github/workflows/refresh-current-public-api-projection.yml
          if git diff --cached --quiet; then
            echo 'No projection change produced'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(surface): refresh current public API projection'
          git push origin HEAD:fix/current-main-public-api-projection
