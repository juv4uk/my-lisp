name: Temporary current-main CI repair

on:
  push:
    branches:
      - fix/current-main-ci-baseline

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/current-main-ci-baseline
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact post-migration CI repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          p = Path("crates/my-lisp/src/value.rs")
          text = p.read_text()
          if "pub type BuiltinFunction" not in text:
              marker = "/// A primitive operation as a first-class value. Contract 2.1 introduced\n"
              alias = "pub type BuiltinFunction = Rc<\n    dyn Fn(&[Value], &crate::Environment, crate::Span) -> Result<Value, crate::LanguageError>,\n>;\n\n"
              if marker not in text:
                  raise SystemExit("Builtin insertion marker not found")
              text = text.replace(marker, alias + marker, 1)

          old_field = "    #[allow(clippy::type_complexity)]\n    pub func: std::rc::Rc<\n        dyn Fn(&[Value], &crate::Environment, crate::Span) -> Result<Value, crate::LanguageError>,\n    >,"
          if old_field in text:
              text = text.replace(old_field, "    pub func: BuiltinFunction,", 1)

          old_host = "    pub fn host_function(\n        function: std::rc::Rc<\n            dyn Fn(\n                &[Value],\n                &crate::Environment,\n                crate::Span,\n            ) -> Result<Value, crate::LanguageError>,\n        >,\n    ) -> Self {"
          if old_host in text:
              text = text.replace(old_host, "    pub fn host_function(function: BuiltinFunction) -> Self {", 1)
          if "pub fn host_function(function: BuiltinFunction)" not in text:
              raise SystemExit("host_function was not normalized to BuiltinFunction")
          p.write_text(text)

          replace_exact(
              "crates/my-lisp/tests/canonical_source_extension.rs",
              'repo_root().join("lib/surface/український-профіль-джерела.всм")',
              'repo_root().join("lib/surface/український-профіль-джерела.lisp")',
          )
          replace_exact(
              "crates/my-lisp/tests/guard.rs",
              '"(language-contract.my crates/my-lisp-cli/src/swarm.rs docs/guard-oracle-node-plan.md)"',
              '"(language-contract.lisp crates/my-lisp-cli/src/swarm.rs docs/guard-oracle-node-plan.md)"',
          )
          replace_exact(
              "crates/my-lisp/tests/guard.rs",
              '"(edit-tasks.my auto-sync-or-sync-tasks verify-projection verify-peer-convergence)"',
              '"(edit-tasks.lisp auto-sync-or-sync-tasks verify-projection verify-peer-convergence)"',
          )

          p = Path("crates/my-lisp-embed/src/lib.rs")
          text = p.read_text()
          safety_blocks = {
              "#[no_mangle]\npub unsafe extern \"C\" fn my_lisp_embed_bind_host_handle": "///\n/// # Safety\n///\n/// `session` must be null or a live pointer returned by `my_lisp_embed_session_new`.\n/// `surface` and `kind` must be null or valid NUL-terminated strings for this call.\n/// Calls using one session must remain on its owning host thread.\n",
              "#[no_mangle]\npub unsafe extern \"C\" fn my_lisp_embed_register_nullary": "///\n/// # Safety\n///\n/// `session` must be null or a live pointer returned by `my_lisp_embed_session_new`.\n/// `surface` must be null or a valid NUL-terminated string for this call. When\n/// present, `callback` and `context` must remain valid for later invocations from\n/// this session. Calls using one session must remain on its owning host thread.\n",
              "#[no_mangle]\npub unsafe extern \"C\" fn my_lisp_embed_eval": "///\n/// # Safety\n///\n/// `session` must be null or a live pointer returned by `my_lisp_embed_session_new`.\n/// `source` must be null or a valid NUL-terminated byte sequence for this call.\n/// Calls using one session must remain on its owning host thread.\n",
              "#[no_mangle]\npub unsafe extern \"C\" fn my_lisp_embed_free_string": "///\n/// # Safety\n///\n/// `value` must be null or a pointer returned by `my_lisp_embed_eval` that has\n/// not already been freed; it must not come from another allocator or API.\n",
              "#[no_mangle]\npub unsafe extern \"C\" fn my_lisp_embed_session_free": "///\n/// # Safety\n///\n/// `session` must be null or a live pointer returned by\n/// `my_lisp_embed_session_new` that has not already been freed. No call may use\n/// the session after this function returns.\n",
          }
          for marker, block in safety_blocks.items():
              if marker not in text:
                  raise SystemExit(f"unsafe C ABI marker missing: {marker}")
              before = text.split(marker, 1)[0]
              if "# Safety" not in before[-700:]:
                  text = text.replace(marker, block + marker, 1)
          p.write_text(text)
          PY
          cargo fmt --all
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repair changes needed"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/my-lisp/src/value.rs crates/my-lisp/tests/canonical_source_extension.rs crates/my-lisp/tests/guard.rs crates/my-lisp-embed/src/lib.rs
          git commit -m "fix(ci): repair current post-.lisp baseline"
          git push origin HEAD:fix/current-main-ci-baseline
