name: Close numeric authority documentation debt

on:
  push:
    branches: [feat/close-language-neutrality-debt]
    paths:
      - '.github/workflows/close-neutrality-docs.yml'

permissions:
  contents: write

jobs:
  close-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/close-language-neutrality-debt
          fetch-depth: 0

      - name: Patch stale authority references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if count is not None and found != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {found}: {old!r}')
              if found == 0:
                  raise SystemExit(f'{path}: missing expected text: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'README.md',
              'Поточний машинний семантичний контракт — [`language-contract.my`](language-contract.my), версія **5.0**.',
              'Поточний машинний семантичний контракт — [`language-contract.my`](language-contract.my), версія **6.0**.',
              1,
          )
          replace(
              'README.md',
              'Машинний словник лежить у [`lib/surface/uk-sa-coverage.wsm`](lib/surface/uk-sa-coverage.wsm).',
              'Єдина машинна таблиця відповідності лежить у [`lib/surface/semantic-registry.wsm`](lib/surface/semantic-registry.wsm): semantic identity там numeric-only, а спільна пунктуація винесена в окрему `sym`-поверхню.',
              1,
          )

          replace(
              'docs/program-surface-translator.md',
              '`lib/surface/uk-sa-coverage.wsm`, тому перекладає лише відомі публічні назви.',
              '`lib/surface/semantic-registry.wsm`, тому перекладає лише відомі публічні назви, зводячи source і target surface через numeric semantic identity.',
              1,
          )
          replace(
              'docs/program-surface-translator.md',
              'comes only from the machine-readable coverage table.',
              'comes only from the numeric semantic registry.',
              1,
          )

          replace(
              'docs/ukrainian-api.md',
              '**Машинне джерело покриття:** [`lib/surface/uk-sa-coverage.wsm`](../lib/surface/uk-sa-coverage.wsm).',
              '**Машинне джерело покриття:** [`lib/surface/semantic-registry.wsm`](../lib/surface/semantic-registry.wsm), де українські назви приєднані до numeric semantic identities.',
              1,
          )

          replace(
              'docs/repl-surfaces.md',
              'EN  stable 140 · candidate 0  · missing 0\nUK  stable 140 · candidate 0  · missing 0\nSA  stable 36  · candidate 88 · missing 16',
              'UK  stable 140 · candidate 0  · missing 0\nEN  stable 131 · candidate 0  · missing 9\nSA  stable 36  · candidate 88 · missing 16',
              1,
          )
          replace(
              'docs/repl-surfaces.md',
              'identity: map\n  EN: map [stable]\n  UK: відобразити [stable]\n  SA: āvartana [candidate]',
              'identity: 0101\n  UK: відобразити [stable]\n  EN: map [stable]\n  SA: āvartana [candidate]',
              1,
          )
          replace(
              'docs/repl-surfaces.md',
              'Триєдина поверхня · public identities: 140\nEN  stable 140 · candidate   0 · missing   0 · compatibility  21\nUK  stable 140 · candidate   0 · missing   0 · compatibility  21\nSA  stable  36 · candidate  88 · missing  16 · compatibility  21\ntrilingual stable: 36/140',
              'Рівноправність людських поверхонь · public identities: 140 · shared symbolic identities: 18\nUK  stable 140 · candidate   0 · missing   0 · compatibility  21\nEN  stable 131 · candidate   0 · missing   9 · compatibility  21\nSA  stable  36 · candidate  88 · missing  16 · compatibility  21\ntrilingual stable: 29/140',
              1,
          )
          replace(
              'docs/repl-surfaces.md',
              'На цьому етапі історична таблиця [`lib/surface/uk-sa-coverage.wsm`](../lib/surface/uk-sa-coverage.wsm) виконує роль триєдиного registry. ADR-005 явно інтерпретує її першу колонку ідентичності як одночасно canonical identity та поточне EN surface name; це тимчасова форма схеми, а не твердження, що English = core.',
              'Єдина машинна authority для surface correspondence — [`lib/surface/semantic-registry.wsm`](../lib/surface/semantic-registry.wsm). Її semantic identities складаються тільки з цифр; UK/EN/SA є людськими surface rows, а спільна пунктуація живе окремо в `sym`. Історична [`lib/surface/uk-sa-coverage.wsm`](../lib/surface/uk-sa-coverage.wsm) лишається аудитом походження назв і не живить REPL introspection.',
              1,
          )
          replace(
              'docs/repl-surfaces.md',
              'відсутня назва — `—{canonical-identity}`.',
              'відсутня назва — `—{numeric-identity}`.',
              1,
          )

          p = Path('docs/adr/ADR-005-TRILINGUAL-SURFACE-PARITY.md')
          text = p.read_text(encoding='utf-8')
          marker = '**Date:** 2026-09-08\n'
          note = ('**Date:** 2026-09-08  \n'
                  '**Registry note:** the legacy `canonical/EN` registry interpretation below is a historical snapshot; ADR-008 supersedes it with numeric-only `semantic-registry.wsm` authority.\n')
          if marker not in text:
              raise SystemExit('ADR-005: date marker not found')
          p.write_text(text.replace(marker, note, 1), encoding='utf-8')

          p = Path('knowledge/guard-reference.wsm')
          text = p.read_text(encoding='utf-8')
          old = '(authority (lib/surface/uk-sa-coverage.wsm lib/surface/uk-docs.wsm docs/ukrainian-api.md lib/surface/uk.my))'
          new = '(authority (lib/surface/semantic-registry.wsm lib/surface/uk-docs.wsm docs/ukrainian-api.md lib/surface/uk.my))'
          if text.count(old) != 1:
              raise SystemExit('guard-reference: expected one Ukrainian surface authority tuple')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Verify authority gates
        shell: bash
        run: |
          python3 scripts/check_semantic_registry.py
          python3 scripts/check_surface_coverage.py
          python3 scripts/check_trilingual_surface.py

      - name: Commit documentation closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/close-neutrality-docs.yml
          git add README.md docs/program-surface-translator.md docs/ukrainian-api.md docs/repl-surfaces.md docs/adr/ADR-005-TRILINGUAL-SURFACE-PARITY.md knowledge/guard-reference.wsm
          git commit -m "docs(surface): close numeric authority references"
          git push origin HEAD:feat/close-language-neutrality-debt
