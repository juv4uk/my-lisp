name: Promote numeric semantic registry

on:
  push:
    branches: [feat/close-language-neutrality-debt]
    paths:
      - '.github/workflows/promote-numeric-registry.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/close-language-neutrality-debt
          fetch-depth: 0

      - name: Promote full surface authority to numeric IDs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          legacy = root / 'lib/surface/uk-sa-coverage.wsm'
          registry = root / 'lib/surface/semantic-registry.wsm'
          docs = root / 'lib/surface/uk-docs.wsm'

          rows = []
          for line in legacy.read_text(encoding='utf-8').splitlines():
              fields = line.split()
              if fields[:1] != ['(entry'] or len(fields) < 7:
                  continue
              category = fields[1].removeprefix('(')
              en, uk, sa = fields[2], fields[3], fields[4]
              uk_status, sa_status = fields[5], fields[6]
              en_status = 'compatibility-only' if uk_status == 'compatibility-only' else 'stable'
              rows.append((category, en, uk, sa, en_status, uk_status, sa_status))

          seed = {
              'quote': '0001', 'atom': '0002', 'eq': '0003', 'cons': '0004',
              'car': '0005', 'cdr': '0006', 'cond': '0007',
              'lambda': '0010', 'define': '0011', 'defmacro': '0012',
              'map': '0101', 'filter': '0102', 'reduce': '0103', '+': '0104',
          }
          used = set(seed.values())
          next_id = 1000
          ids = {}
          for _, en, *_ in rows:
              if en in seed:
                  ids[en] = seed[en]
                  continue
              while f'{next_id:04d}' in used:
                  next_id += 1
              ident = f'{next_id:04d}'
              next_id += 1
              used.add(ident)
              ids[en] = ident

          canon_symbols = {
              'quote': "'", 'atom': '.?', 'eq': '=?', 'cons': ':',
              'car': ':п', 'cdr': ':р', 'cond': '?:',
          }

          out = [
              '; Єдина машинна authority мовних поверхонь — numeric-only schema.',
              '; Значення первинне. Мови рівноправні.',
              ';',
              '; Кожен перший атом — непрозорий semantic ID і містить ТІЛЬКИ цифри.',
              '; uk/en/sa — людські поверхні. sym — спільна немовна нотація.',
              '; Порядок surface-форм не має семантичного значення.',
              '; Старий uk-sa-coverage.wsm більше НЕ є authority.',
              '',
              '(sr/1',
          ]

          for category, en, uk, sa, en_status, uk_status, sa_status in rows:
              ident = ids[en]
              surfaces = []

              # Pure punctuation/operators are a shared symbolic surface, never EN.
              pure_symbol = not any(ch.isalpha() for ch in en)
              if pure_symbol:
                  human_en_status = 'compatibility-only' if en_status == 'compatibility-only' else 'missing'
                  surfaces.append(('en', '—', human_en_status))
              else:
                  surfaces.append(('en', en, en_status))

              surfaces.append(('uk', uk, uk_status))
              # Runtime Contract 6 ratified anukrama; legacy krama was stale.
              if en == 'cond':
                  sa = 'anukrama'
              surfaces.append(('sa', sa, sa_status))

              if pure_symbol:
                  sym_status = 'compatibility-only' if en_status == 'compatibility-only' else 'stable'
                  surfaces.append(('sym', en, sym_status))
              if en in canon_symbols:
                  surfaces.append(('sym', canon_symbols[en], 'stable'))

              rendered = ' '.join(f'({lang} {name} {status})' for lang, name, status in surfaces)
              out.append(f'  ({ident} {rendered})')

          out.append(')')
          out.append('')
          registry.write_text('\n'.join(out), encoding='utf-8')

          # Numeric IDs replace EN spellings as the documentation join key.
          source = docs.read_text(encoding='utf-8')
          source = source.replace(
              '; Набір пар EN↔UK мусить точно збігатися зі stable-рядками uk-sa-coverage.wsm.',
              '; Numeric ID↔UK мусить точно збігатися зі stable UK-рядками semantic-registry.wsm.'
          )
          source = source.replace('(schema uk-api-docs/1)', '(schema uk-api-docs/2)')
          new_lines = []
          for line in source.splitlines():
              stripped = line.lstrip()
              if stripped.startswith('(doc '):
                  fields = stripped.split(None, 4)
                  # (doc CATEGORY OLD-EN UK ...  -> (doc CATEGORY NUMERIC-ID UK ...
                  old_en = fields[2]
                  if old_en not in ids:
                      raise SystemExit(f'uk-docs references unknown legacy identity: {old_en}')
                  prefix = line[:len(line) - len(stripped)]
                  line = prefix + f'{fields[0]} {fields[1]} {ids[old_en]} {fields[3]} {fields[4]}'
              new_lines.append(line)
          docs.write_text('\n'.join(new_lines) + '\n', encoding='utf-8')

          # Legacy table remains readable history, but cannot be mistaken for authority.
          legacy_text = legacy.read_text(encoding='utf-8')
          banner = (
              '; LEGACY AUDIT / ІСТОРИЧНИЙ АУДИТ — НЕ SEMANTIC AUTHORITY.\n'
              '; Authoritative machine identities live in semantic-registry.wsm and are numeric-only.\n'
          )
          if not legacy_text.startswith('; LEGACY AUDIT'):
              legacy.write_text(banner + legacy_text, encoding='utf-8')

          print(f'promoted {len(rows)} identities; numeric IDs: {len(ids)}')
          print('symbolic EN-shaped names were separated into sym')
          PY

      - name: Commit generated authority and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/promote-numeric-registry.yml
          git add lib/surface/semantic-registry.wsm lib/surface/uk-docs.wsm lib/surface/uk-sa-coverage.wsm
          git commit -m "feat(surface): promote full numeric semantic authority"
          git push origin HEAD:feat/close-language-neutrality-debt
