name: Stage H3 inventory fix

on:
  push:
    branches: [refactor/stage-h3-semantic-tooling-discovery]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/stage-h3-semantic-tooling-discovery
      - name: Align inventory classification with registry admission statuses
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/my-lisp/tests/uk_surface_inventory.rs')
          text = p.read_text()
          old = '''            let surface = fields[0];
            let name = fields[1];
            let status = fields[2];
            if matches!(surface, "uk" | "en" | "sa" | "sym")
                && status != "missing"
                && name != "—"
            {
                Some(name.to_owned())
            } else {
                None
            }'''
          new = '''            let name = fields[1];
            let status = fields[2];
            // Discovery is status-governed, not limited to a closed list of
            // human/symbolic surface labels. H.2 introduced an explicit
            // `compat` surface, and future surface kinds must not require a
            // second Rust schema here. Candidate/missing names are not live.
            if matches!(status, "stable" | "compatibility-only") && name != "—" {
                Some(name.to_owned())
            } else {
                None
            }'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one inventory surface parser anchor, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/stage-h3-inventory-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/my-lisp/tests/uk_surface_inventory.rs .github/workflows/stage-h3-inventory-fix.yml
          git commit -m "fix(tooling): classify registry surfaces by admission status"
          git push
