name: Verify #524 d295 CLI baseline

on:
  pull_request:

permissions:
  contents: read

jobs:
  cli-baseline:
    if: github.event.pull_request.head.ref == 'verify/524-d295-cli-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify-524-d295-cli
      - name: Exact CLI smoke
        run: cargo test -p my-lisp-cli --test cli -- --nocapture
