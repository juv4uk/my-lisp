name: tmp-263-knowledge-regression

on:
  push:
    branches:
      - test/218-knowledge-clause-kind

permissions:
  contents: read

jobs:
  knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Run knowledge public-behavior regression suite
        run: cargo test -p my-lisp --test knowledge
