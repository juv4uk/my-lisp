name: Fix Ukrainian profile guard once

on:
  push:
    branches:
      - prep/ukrainian-full-source

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prep/ukrainian-full-source
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Replace invalid first-class alias with capability wrapper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/перевірити-український-профіль.всм')
          text = path.read_text()
          old = '(визначити прочитати-файл read-file)'
          new = '(визначити прочитати-файл\n  (функція (шлях)\n    (read-file шлях)))'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('expected read-file bridge not found')
          PY
      - name: Build CLI and prove the guard
        run: |
          cargo build -p my-lisp-cli --bin my-lisp
          ./target/debug/my-lisp scripts/перевірити-український-профіль.всм
      - name: Commit verified guard fix
        run: |
          if git diff --quiet -- scripts/перевірити-український-профіль.всм; then
            echo "Guard already fixed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/перевірити-український-профіль.всм
          git commit -m "fix(surface): wrap read-file capability in Ukrainian guard"
          git push origin HEAD:prep/ukrainian-full-source
