name: Verify 1044 RED

on:
  pull_request:

permissions:
  contents: read

jobs:
  uk-direct-peer-1044:
    if: github.event.pull_request.head.ref == 'work/chatgpt-uk-peer-1044'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Require 1044 UK peer to have no EN bridge
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fqx '(define довжина-тексту string-length)' lib/surface/uk.lisp; then
            echo 'RED 1044: stable UK довжина-тексту still routes through EN string-length in uk.lisp' >&2
            exit 1
          fi
          echo 'GREEN 1044: no UK->EN surface bridge remains'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify-1044-peer
      - name: Verify all stable EN/UK runtime peers
        run: cargo test -p my-lisp --test uk_surface_equivalence every_stable_uk_surface_entry_resolves_to_its_declared_operation -- --nocapture
