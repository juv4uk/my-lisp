name: UKR clean replay bootstrap

on:
  push:
    branches:
      - prep/ukr-surface-current-main
    paths:
      - .github/workflows/ukr-replay-bootstrap.yml

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean current-main branch
        uses: actions/checkout@v5
        with:
          ref: prep/ukr-surface-current-main
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Reconcile proven UKR state onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "my-lisp replay bot"
          git config user.email "85576956+juv4uk@users.noreply.github.com"

          OLD_UKR=915d69a5cd18ec5bdeb27dc6355ccc025aa585a7
          OLD_DOCS=74d113977ed9610492968238752b9143de23ead9

          git fetch origin feat/ukr-surface-lisp-main feat/full-uk-cyrillic-surface
          git cat-file -e "$OLD_UKR^{commit}"
          git cat-file -e "$OLD_DOCS^{commit}"

          # Replay only the final, proven UKR source/test state. Do not merge old history.
          git checkout "$OLD_UKR" -- \
            crates/my-lisp-cli/tests/uk_surface_audit_projection.rs \
            crates/my-lisp/src/semantic_registry.rs \
            crates/my-lisp/tests/full_uk_surface.rs \
            crates/my-lisp/tests/uk_docs_surface_model.rs \
            crates/my-lisp/tests/ukr_acceptance.rs \
            lib/surface/semantic-registry.lisp \
            lib/surface/ukr-acceptance.lisp \
            lib/surface/український-профіль-джерела.lisp \
            scripts/generate-function-table.lisp

          # Preserve current-main tooling hooks while adding only the UKR peer-binding delta.
          BASE=$(git merge-base HEAD "$OLD_UKR")
          git diff "$BASE" "$OLD_UKR" -- crates/my-lisp/src/lib.rs > /tmp/ukr-lib.patch
          git apply --3way /tmp/ukr-lib.patch

          # Harvest documentation architecture from #101, adapting retired extensions.
          git show "$OLD_DOCS":lib/surface/uk-docs.wsm \
            | sed 's/semantic-registry\.wsm/semantic-registry.lisp/g' \
            > lib/surface/uk-docs.lisp
          git show "$OLD_DOCS":scripts/generate-ukrainian-api.py \
            | sed 's/uk-docs\.wsm/uk-docs.lisp/g; s/function-table\.wsm/function-table.lisp/g; s/semantic-registry\.wsm/semantic-registry.lisp/g' \
            > scripts/generate-ukrainian-api.py
          chmod +x scripts/generate-ukrainian-api.py
          git show "$OLD_DOCS":docs/ukrainian-api.md \
            | sed 's/\.wsm/\.lisp/g; s/\.my/\.lisp/g' \
            > docs/ukrainian-api.md

          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          start = text.index('## Українською можна програмувати')
          pred = text.index('### Предикати читаються як питання', start)
          replacement = '''## Українською можна програмувати

Українська — не лише мова README. Українські імена є peer-проєкціями тих самих numeric semantic IDs у [`lib/surface/semantic-registry.lisp`](lib/surface/semantic-registry.lisp); вони не створюють окремої реалізації функцій.

У проєкті розрізняються **дві українські поверхні**:

- `uk` — коротка, інтуїтивно зрозуміла українська поверхня для щоденного програмування;
- `ukr` — повна українська поверхня, де ім'я максимально явно описує операцію.

Обидві належать **тому самому semantic ID**. Якщо чинне `uk`-ім'я вже коротке й ясне, `uk` і `ukr` можуть бути однаковими. Якщо повна назва краще пояснює дію, `ukr` може бути довшою:

| semantic ID | `uk` | `ukr` | статус `ukr` |
|---:|---|---|---|
| `0002` | `атом?` | `атом?` | stable |
| `0011` | `визначити` | `визначити` | stable |
| `1045` | `текст-порожній?` | `порожній-текст?` | stable |
| `1075` | `монотонний-нс` | `монотонний-час-у-наносекундах` | candidate |
| `1079` | `поточний-всч` | `поточний-всесвітній-координований-час` | candidate |

`stable` означає admitted/executable spelling. `candidate` — назва для review, яка **ще не обіцяється як виконуваний API**. Лише registry може підвищити `candidate` до `stable`.

Повна жива таблиця `uk | ukr | English | Sanskrit` генерується з authority: [`docs/generated/function-table.md`](docs/generated/function-table.md). Детальні пояснення поведінки: [`docs/ukrainian-api.md`](docs/ukrainian-api.md). Репрезентативний executable witness без перемикання на латинську розкладку: [`lib/surface/ukr-acceptance.lisp`](lib/surface/ukr-acceptance.lisp).

Поточний код через stable `uk` може виглядати так:

```lisp
(визначити квадрат
  (функція (число)
    (помножити число число)))
```

'''
          text = text[:start] + replacement + text[pred:]
          text = text.replace("(містить? 'пес (список 'кіт 'пес))", "(значення-у-списку? 'пес (список 'кіт 'пес))")
          text = text.replace('`карта-отримати`', '`отримати-з-карти`')
          p.write_text(text, encoding='utf-8')
          PY

          # Regenerate every projection from the current numeric/Lisp authority.
          python3 scripts/generate-meta-semantic-registry.py
          cargo run -p my-lisp-cli --bin my-lisp -- scripts/generate-function-table.lisp
          python3 scripts/generate-ukrainian-api.py

          # Focused evidence before creating the replay commit.
          python3 scripts/generate-meta-semantic-registry.py --check
          python3 scripts/generate-ukrainian-api.py --check
          cargo test -p my-lisp --test full_uk_surface --test ukr_acceptance --test uk_docs_surface_model
          cargo test -p my-lisp-cli --test uk_surface_audit_projection

          # The bootstrap workflow must not survive into the merge candidate.
          git rm .github/workflows/ukr-replay-bootstrap.yml
          git add -A
          git diff --cached --check
          git commit -m "feat(ukr): replay full Ukrainian peer surface on current main"
          git push origin HEAD:prep/ukr-surface-current-main
