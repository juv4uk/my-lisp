name: UKR clean replay bootstrap

on:
  push:
    branches:
      - prep/ukr-surface-current-main
    paths:
      - .github/workflows/ukr-replay-bootstrap.yml

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prep/ukr-surface-current-main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Replay proven UKR state
        run: bash .github/scripts/ukr-replay-bootstrap.sh
