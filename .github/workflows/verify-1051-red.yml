name: Verify 1051 RED

on:
  push:
    branches:
      - work/chatgpt-uk-peer-1051
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-1051-direct-peer:
    name: Require 1051 UK peer to have no EN bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Require registry-driven topology
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fqx '(define символ-у-текст symbol->string)' lib/surface/uk.lisp; then
            echo '1051 RED: stable UK символ-у-текст still routes through EN symbol->string' >&2
            exit 1
          fi
      - name: Prove stable UK runtime identity
        run: cargo test -p my-lisp --test uk_surface_equivalence every_stable_uk_surface_entry_resolves_to_its_declared_operation -- --exact
