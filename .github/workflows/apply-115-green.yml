name: Apply #115 GREEN

on:
  push:
    branches: [fix/115-deletion-only-authority]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/115-deletion-only-authority
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply patch
        run: python3 scripts/apply-115-green.py
      - name: Verify one-way authority migration
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "psych"; Psych.parse_file(".github/workflows/ci.yml")'
          cargo test -p my-lisp --test authority_guard_contract
          cargo build -p my-lisp-cli --bin my-lisp

          printf '(change "crates/my-lisp/tests/mccarthy.rs" deletion-only)\n' > tests/changed-host-tests.lisp
          if ! ./target/debug/my-lisp scripts/authority-guard.lisp > /tmp/authority-deletion.log 2>&1; then
            cat /tmp/authority-deletion.log
            exit 1
          fi
          cat /tmp/authority-deletion.log
          grep -q 'authority-ok' /tmp/authority-deletion.log

          printf '(change "crates/my-lisp/tests/mccarthy.rs" modified)\n' > tests/changed-host-tests.lisp
          if ./target/debug/my-lisp scripts/authority-guard.lisp > /tmp/authority-modified.log 2>&1; then
            echo 'ERROR: modified semantic-authority unexpectedly passed'
            exit 1
          fi
          cat /tmp/authority-modified.log
          grep -q 'semantic-authority-violation' /tmp/authority-modified.log
      - name: Commit verified GREEN
        shell: bash
        run: |
          set -euo pipefail
          rm -f tests/changed-host-tests.lisp
          rm -f scripts/apply-115-green.py
          rm -f .github/workflows/apply-115-green.yml
          rm -f .github/workflows/apply-authority-green.yml
          rm -f .github/workflows/targeted-authority-red.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(#115): allow one-way retirement of host semantic authority'
          git push origin HEAD:fix/115-deletion-only-authority