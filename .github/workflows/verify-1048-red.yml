name: Verify 1048 RED

on:
  pull_request:

permissions:
  contents: read

jobs:
  uk-direct-peer-1048:
    if: github.event.pull_request.head.ref == 'work/chatgpt-uk-peer-1048'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Require 1048 preferred UK peer to have no EN bridge
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fqx '(define перший-символ-тексту string-first)' lib/surface/uk.lisp; then
            echo 'RED 1048: stable preferred UK перший-символ-тексту still routes through EN string-first' >&2
            exit 1
          fi
          grep -Fqx '(define перший-знак string-first)' lib/surface/uk.lisp
          echo 'GREEN 1048: preferred peer is registry-driven and historical compatibility alias remains'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify-1048-peer
      - name: Verify stable EN/UK runtime peers
        run: cargo test -p my-lisp --test uk_surface_equivalence every_stable_uk_surface_entry_resolves_to_its_declared_operation -- --nocapture
