name: 382 RED probe

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  repo-tooling-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: repo-tooling-red
      - name: Build canonical CLI
        run: cargo build -p my-lisp-cli --bin my-lisp
      - name: Run #382 checker and report diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set +e
          output=$(./target/debug/my-lisp scripts/check-repo-tooling-inventory.lisp 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [[ $status -ne 0 ]]; then
            {
              echo '### #382 checker diagnostic'
              echo
              echo '```text'
              printf '%s\n' "$output"
              echo '```'
            } > /tmp/382-diagnostic.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/382-diagnostic.md
          fi
          exit "$status"
