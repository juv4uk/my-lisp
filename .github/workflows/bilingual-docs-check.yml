name: Bilingual Documentation Check

on:
  push:
    paths:
      - "**/*.md"
      - "scripts/check-bilingual-docs"
      - ".github/workflows/bilingual-docs-check.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check-bilingual-docs"
      - ".github/workflows/bilingual-docs-check.yml"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50

      - name: Determine changed markdown files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=50
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
              base="HEAD~1"
            fi
          fi
          files=$(git diff --name-only "$base" HEAD -- '*.md' || true)
          {
            echo "files<<BILINGUAL_EOF"
            echo "$files"
            echo "BILINGUAL_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check Ukrainian-first order for changed docs
        if: steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          chmod +x scripts/check-bilingual-docs
          # CHANGED_FILES is newline-separated (multiple files). Passing it
          # unquoted as ${{ ... }} interpolation (the old form) splices the
          # raw multi-line text directly into this script, so the 2nd+
          # filenames each become their OWN shell command instead of extra
          # arguments -- confirmed live 2026-09-08 (run 34225535414): a real
          # 3-file commit failed with "Permission denied" (exit 126) because
          # bash tried to execute the second .md file as a program. env: +
          # xargs -d '\n' passes the list safely regardless of file count.
          printf '%s\n' "$CHANGED_FILES" | xargs -d '\n' -r ./scripts/check-bilingual-docs
