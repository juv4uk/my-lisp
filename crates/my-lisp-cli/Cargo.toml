[package]
name = "my-lisp-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "my-lisp"
path = "src/main.rs"

[dependencies]
my-lisp = { path = "../my-lisp" }
rustyline = { version = "14.0.0", features = ["with-file-history"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
